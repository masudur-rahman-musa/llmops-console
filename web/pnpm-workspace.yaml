# GHSA-vfj7-8cjw-p6xm (braces <=3.0.3) has no patched version at all, so
# `pnpm audit` would fail on it forever. Skipped on 2026-10-12; drop it
# once a fixed braces ships.
#
# GHSA-g3hv-75wg-m249 (minimatch <11.0.1) is fixed only in minimatch 11, and
# no eslint or typescript-eslint release accepts it yet (eslint 9 needs 3.x,
# the newest ones 10.x), so forcing 11 would break the linter. It only runs
# at lint time on our own globs, never in the shipped app. Skipped on
# 2026-11-02; drop it once eslint takes a fixed minimatch.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-g3hv-75wg-m249

overrides:
  postcss@<8.5.10: '>=8.5.10'
  postcss@<=8.5.11: '>=8.5.12'
  postcss@<=8.5.17: '>=8.5.18'
  postcss@<=8.5.22: '>=8.5.23'
  sharp@<0.35.5: '>=0.35.5'
  source-map-js@>=1.0.0 <1.2.2: '>=1.2.2'
  '@vitest/mocker@>=2.1.0-beta.7 <4.1.12': '>=4.1.12 <5'
