[project]
name = "ai-operations-console"
version = "0.1.0"
description = "LLM gateway with routing, redaction, caching, budgets and evals"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    # Runtime, not dev: the provider adapters call out over it. The test suite
    # uses its MockTransport, so the dev group needs no entry of its own.
    "httpx>=0.28",
    # Tracing. The SDK builds the spans; the OTLP/HTTP
    # exporter ships them to Langfuse EU, which is an OTLP endpoint with a
    # basic-auth header rather than a service needing its own SDK. No
    # `opentelemetry-instrumentation-*`: every span in a trace here is a line
    # someone wrote. The tests use the SDK's own InMemorySpanExporter, so the
    # dev group needs no entry for this.
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp-proto-http>=1.29",
    # Metrics. The reference client: it owns the text
    # exposition format and its content type, and its counters are already
    # correct under the worker threads FastAPI runs `def` routes in. The
    # families live in a module-owned CollectorRegistry rather than its global
    # one, so a second create_app in one process registers no duplicate and the
    # process, GC and platform collectors nobody chose never appear.
    "prometheus-client>=0.21",
    # Backing services. `redis` is both the readiness
    # probe's client and the store behind `RedisRedactionMapStore`; `psycopg` is
    # the Postgres probe's, with the binary wheel so a build toolchain is not a
    # prerequisite for `uv sync`. Qdrant is probed over the `httpx` already here
    # rather than through a client library, because a probe is one GET.
    "redis>=5",
    # `pool` on top of `binary`: the cost ledger is a
    # write on every served request, so a connect-per-write would put a TCP and
    # TLS handshake on the hot path. `psycopg_pool` ships separately from
    # `psycopg`, which is why the extra is named here rather than assumed.
    "psycopg[binary,pool]>=3.2",
]

# The two deploy commands the ledger owns. Declared as entry points
# rather than left to `python -m`, because the Makefile targets and the k8s Job
# and CronJob that will call them all want one name that works inside the image.
[project.scripts]
ops-migrate = "app.cli.ledger:migrate"
# The two halves of `make numbers` that talk to the gateway.
ops-send-traffic = "app.cli.numbers:send_traffic"
ops-check-console = "app.cli.numbers:check_console"
# The eval harness. `make eval` names this command, and so will the
# CronJob that runs the nightly set, which is why it is a script and not a
# `python -m` invocation nobody can spell inside the image.
ops-eval = "app.cli.evals:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    # `make fast` runs the non-slow tests across workers; one worker per core
    # cuts the everyday run well under the two-minute target.
    "pytest-xdist>=3.6",
    "hypothesis>=6.115",
    "types-PyYAML>=6.0",
    # Pinned exactly, and to the same version as the ruff pre-commit hook: CI's
    # formatting verdict comes from the hook, so a drift between the two is a
    # CI failure with no local command that reproduces it.
    "ruff==0.16.6",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The one app lives at `backend/app/` and imports as `app`; include just it.
only-include = ["app"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
# Without this, `exclude` is advisory for a path named on the command line, and
# the PostToolUse formatter hook always names one explicit path.
force-exclude = true
# `dev/` holds the owner's private working files and helper scripts. They never
# ship, so neither lint nor format reads them.
extend-exclude = ["dev/**"]

[tool.ruff.lint]
# `W` is here for W605 specifically: a docstring citing a regex or a `grep -E`
# is a habit in this repo, and `\(` in a non-raw docstring passes both mypy and
# every other rule while emitting a SyntaxWarning nothing reads - and it becomes
# a SyntaxError in a later Python.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Agent hooks keep long rule strings on one line so the pattern stays readable.
# Everything else (F, B, ...) still applies to them.
".claude/**" = ["E501"]

[tool.ruff.lint.isort]
# The app imports as `app` from `backend/app/`; name it first-party so its
# imports group apart from third-party ones and I001 stays correct.
known-first-party = ["app"]

[tool.ruff.format]
# `.claude/` is agent tooling checked in as-is; linting it is useful, reflowing
# it is a diff outside every plan's file list.
exclude = [".claude/**"]

[tool.mypy]
files = ["app", "tests"]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# `slow` marks a test the everyday `make fast` run skips (`-m "not slow"`). CI
# and `make verify` still run every test, slow ones included. Registered so an
# unknown-marker warning cannot hide a typo'd mark.
markers = [
    "slow: a slow test, skipped by `make fast` but run by CI and `make verify`",
    "db: a test that reaches a real backing service (Postgres, Redis or Qdrant)",
]

[tool.coverage.run]
source = ["app"]
# Statement coverage would call a guard 100% covered with one side of every
# `if` never taken, which is exactly what the 100% packages exist to rule out.
branch = true

[tool.coverage.report]
show_missing = true
