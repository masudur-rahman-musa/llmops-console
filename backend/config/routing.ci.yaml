# The CI budget overlay (a "$2 hard budget per run").
#
# A PARTIAL document, not a policy: merged over the shipped `routing.yaml`, with
# both the compose gateway and `ops-eval conversations` pointed at the result. The prod number stays `10.00` in `routing.yaml`, which is what a
# tenant gets outside a gate run.
#
# The cap lives in config because it cannot live anywhere else: `limits/budget.py`
# verifies a signed override that RAISES a cap, so there is no runtime way to
# express a lower one for the duration of a run.
#
# The budget is a STRING. The policy loader reads these as decimal strings, and a
# bare `2.00` is a YAML float - a number that looks right and does not merge.
#
# Not merged by the pull request gate: `make eval` runs the gateway on the shipped
# `routing.yaml` (see `infra/evals/compose.yml`). This cap is for a run that
# points the gateway and `ops-eval conversations` at the merged policy itself.
tenants:
  evals:
    budget_usd_month: "2.00"
