# Routing policy.
#
# This is the only shipped file that contains a provider model id: nothing the
# gateway runs names one anywhere else. Test fixtures carry their own ids.
# Clients name a model by alias; the gateway resolves the alias here, per tenant
# and per data class. The schema is enforced on load by
# `opsconsole.routing.policy`, and the file itself is a test case: it is loaded
# and swept for every (tenant, alias, data class) triple by the routing tests.
#
# Keys never hold a secret. `key_env` names the environment variable the
# provider adapter reads.

providers:
  anthropic:
    kind: anthropic
    base_url: https://api.anthropic.com
    key_env: ANTHROPIC_API_KEY
  anthropic_eu:
    kind: anthropic
    base_url: https://api.anthropic.com
    key_env: ANTHROPIC_EU_API_KEY
    enabled: false
  openai:
    kind: openai
    base_url: https://api.openai.com/v1
    key_env: OPENAI_API_KEY
    enabled: false
  azure_eu:
    kind: azure_openai
    endpoint_env: AZURE_OPENAI_ENDPOINT
    key_env: AZURE_OPENAI_KEY
    enabled: false
  local:
    kind: openai_compatible
    base_url: http://llama:8082/v1
  # One llama.cpp process serves ONE model, so the embedding server is a second
  # address and therefore a second provider rather than another alias here. Its
  # id is what the ledger books every embedding row under and the first half of
  # that row's price key.
  local_embed:
    kind: openai_compatible
    base_url: http://llama-embed:8083/v1
  vllm:
    kind: openai_compatible
    base_url: http://vllm.gpu.svc.cluster.local:8000/v1
    enabled: false

aliases:
  # The only alias on the semantic cache (#23). A chat assistant's callers ask the
  # same question in different words, which is the reuse this tier exists for; a
  # judge, an extraction and an embedding need the answer to THEIR input and not
  # to one that resembles it, so they stay off. Off is the default, so turning
  # this on anywhere is a deliberate line in this file.
  agent-default:
    semantic_cache: true
    candidates:
      # Haiku 5.5 is the cheap model the evals run on. OpenAI is not a
      # candidate anywhere: the `openai` provider below stays, disabled, so turning it
      # on later is one line, not a new block.
      - { provider: anthropic, model: claude-haiku-5-5 }
      - { provider: anthropic_eu, model: claude-haiku-5-5 }
      - { provider: local, model: qwen2.5-3b-instruct }
  # A strong alias lists only strong models. Never add a candidate the alias does
  # not honestly describe.
  agent-strong:
    candidates:
      - { provider: anthropic, model: claude-sonnet-5-5 }
      - { provider: anthropic_eu, model: claude-sonnet-5-5 }
  # Haiku 5.5 while it agrees with the reference labels at 0.7 or better;
  # below that this line becomes Sonnet 5.5 and the judge is calibrated once more.
  judge:
    candidates:
      - { provider: anthropic, model: claude-haiku-5-5 }
  embed:
    candidates:
      - { provider: local_embed, model: bge-small-en-v1.5 }

tenants:
  nordlicht:
    data_class_rules:
      public: { redact: false }
      internal: { redact: false }
      confidential: { redact: true }
      pii: { redact: true }
    budget_usd_month: "15.00"
    rate_limit: { rpm: 60, tpm: 60000 }
    # This tenant prefers the cheap hosted model first, then the local one.
    overrides:
      agent-default:
        - { provider: anthropic, model: claude-haiku-5-5 }
        - { provider: local, model: qwen2.5-3b-instruct }
  cuan:
    data_class_rules:
      public: { redact: false }
      internal: { redact: false }
      confidential: { redact: true }
      pii: { redact: true }
    budget_usd_month: "60.00"
    rate_limit: { rpm: 6000, tpm: 6000000 }
  # The eval harness: our own traffic.
  evals:
    data_class_rules:
      public: { redact: false }
      internal: { redact: false }
      confidential: { redact: true }
      pii: { redact: true }
    budget_usd_month: "10.00"
    rate_limit: { rpm: 120, tpm: 120000 }
