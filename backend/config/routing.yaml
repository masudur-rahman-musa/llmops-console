# Routing policy: aliases and tenants.
#
# Providers are not declared here. Each one is a file in `backend/config/providers/`
# with its kind, address, key name and models with prices. This file
# and those files are the only shipped files that name a provider model id.
# Test fixtures carry their own ids.
# Clients name a model by alias; the gateway resolves the alias here, per tenant
# and per data class. The schema is enforced on load by
# `opsconsole.routing.policy`, and the file itself is a test case: it is loaded
# and swept for every (tenant, alias, data class) triple by the routing tests.
#
# Each alias has a `purpose`, the one line the console's Models page shows.
# Each alias lists its providers in order: the first is the default, the rest
# are fallbacks. Chat runs on Anthropic, then OpenAI if Anthropic does not answer.

aliases:
  # The only alias on the semantic cache (#23). A chat assistant's callers ask the
  # same question in different words, which is the reuse this tier exists for; a
  # judge, an extraction and an embedding need the answer to THEIR input and not
  # to one that resembles it, so they stay off. Off is the default, so turning
  # this on anywhere is a deliberate line in this file.
  agent-default:
    semantic_cache: true
    purpose: "Everyday help desk chat replies on the cheap model."
    candidates:
      # Haiku 5.5 is the cheap model the evals run on.
      - { provider: anthropic, model: claude-haiku-5-5 }
      - { provider: openai, model: gpt-5-mini }
  # A strong alias lists only strong models. Never add a candidate the alias does
  # not honestly describe.
  agent-strong:
    purpose: "Harder chat turns that need the strong model."
    candidates:
      - { provider: anthropic, model: claude-sonnet-5-5 }
      - { provider: openai, model: gpt-5 }
  # Haiku 5.5 while it agrees with the reference labels at 0.7 or better;
  # below that this line becomes Sonnet 5.5 and the judge is calibrated once more.
  # The judge is calibrated on Anthropic; OpenAI only answers when Anthropic is down.
  judge:
    purpose: "Grades eval answers against the reference labels."
    candidates:
      - { provider: anthropic, model: claude-haiku-5-5 }
      - { provider: openai, model: gpt-5-mini }
  # Only the local embedding server: a second embedding model writes vectors in
  # a different space and breaks search over the stored ones.
  embed:
    purpose: "Turns text into vectors for search and the semantic cache."
    candidates:
      - { provider: local_embed, model: bge-small-en-v1.5 }

tenants:
  nordlicht:
    data_class_rules:
      public: { redact: false }
      internal: { redact: false }
      confidential: { redact: true }
      pii: { redact: true }
    budget_usd_month: "15.00"
    rate_limit: { rpm: 60, tpm: 60000 }
  cuan:
    data_class_rules:
      public: { redact: false }
      internal: { redact: false }
      confidential: { redact: true }
      pii: { redact: true }
    budget_usd_month: "60.00"
    rate_limit: { rpm: 6000, tpm: 6000000 }
  # The eval harness: our own traffic.
  evals:
    data_class_rules:
      public: { redact: false }
      internal: { redact: false }
      confidential: { redact: true }
      pii: { redact: true }
    budget_usd_month: "10.00"
    rate_limit: { rpm: 120, tpm: 120000 }
