# Routing policy for the k6 load run, and nothing else.
#
# A whole document, not an overlay: the gateway validates it entire at startup,
# and no real provider is named in it, so a load run cannot reach one whatever
# `.env` holds. Both providers point at the fixed-delay mock in
# `infra/load/mock-provider/`. Their ids and model ids are the shipped
# `routing.yaml` ones, so every request is priced against the existing
# `prices.yaml` rows.

providers:
  local:
    kind: openai_compatible
    base_url: http://mock-provider:8090/v1
  local_embed:
    kind: openai_compatible
    base_url: http://mock-provider:8090/v1

aliases:
  agent-default:
    semantic_cache: true
    candidates:
      - { provider: local, model: qwen2.5-3b-instruct }
  embed:
    candidates:
      - { provider: local_embed, model: bge-small-en-v1.5 }

tenants:
  # Ceilings far above what 50 RPS for ten minutes spends, so the run measures
  # the gateway serving traffic, never a limiter refusing it.
  load:
    data_class_rules:
      public: { redact: false }
      internal: { redact: false }
      confidential: { redact: true }
      pii: { redact: true }
    budget_usd_month: "100000.00"
    rate_limit: { rpm: 6000, tpm: 6000000 }
