# The `gpu` namespace and its envelope.
#
# The quota is sized to what this directory runs, with the fetch Job counted
# while it is still running alongside everything else:
#
#   workload             requests.memory  requests.cpu  limits.memory
#   vllm                 10Gi             2             14Gi
#   vllm-model-fetch     512Mi            200m          1Gi
#   prometheus           256Mi            150m          512Mi
#   prometheus-adapter   128Mi            100m          256Mi
#   total                10.875Gi         2450m         15.75Gi
#
# `requests.nvidia.com/gpu: "1"` is the line that matters most: it refuses a
# second GPU pod at admission rather than leaving it Pending on a host that has
# exactly one GPU.
apiVersion: v1
kind: Namespace
metadata:
  name: gpu
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: gpu-envelope
  namespace: gpu
spec:
  hard:
    requests.memory: 11Gi
    requests.cpu: 2500m
    limits.memory: 16Gi
    requests.nvidia.com/gpu: "1"
---
# The same defaults as `base/limitranges.yaml`. A quota naming `requests.memory`
# makes admission refuse any container that states none; with this in place the
# vLLM initContainer, which states none, is defaulted instead.
apiVersion: v1
kind: LimitRange
metadata:
  name: gpu-defaults
  namespace: gpu
spec:
  limits:
    - type: Container
      defaultRequest:
        memory: 64Mi
        cpu: 50m
      default:
        memory: 256Mi
        cpu: 500m
