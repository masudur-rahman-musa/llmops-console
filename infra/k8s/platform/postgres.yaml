# Postgres: the ledger, the eval runs and the budget windows. The same
# `postgres:16` the local stack runs, so a developer debugs one
# version rather than two.
#
# Credentials arrive by reference only: `postgres-credentials`
# carries POSTGRES_USER, POSTGRES_PASSWORD and POSTGRES_DB, and the SOPS-encrypted
# secrets file supplies it. Nothing else in this repo writes that Secret, so an apply before
# it exists fails loudly on a missing one rather than coming up with a password
# that is in git.
#
# `PGDATA` points at a SUBDIRECTORY of the mount, not at the mount itself: a
# PersistentVolume arrives with a `lost+found` on several storage classes, and
# initdb refuses a data directory that is not empty.
#
# `storageClassName` is deliberately absent. k3s defaults to
# `local-path` and EKS to `gp2`, so the manifest leaves neither StatefulSet
# Pending on a class that does not exist there.
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: platform
  labels:
    app.kubernetes.io/name: postgres
spec:
  serviceName: postgres
  replicas: 1
  # Written here AND on the pod template below: the root kustomization sets its
  # two common labels with `includeSelectors: false`, so they reach neither this
  # selector nor the template, and a workload that relied on them would select
  # nothing.
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credentials
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              memory: 512Mi
              cpu: 200m
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: platform
  labels:
    app.kubernetes.io/name: postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
