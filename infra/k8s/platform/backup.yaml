# Nightly Postgres and Qdrant backups: a "CronJob
# to a PVC and to Hetzner Object Storage" taken literally. Two CronJobs share
# one `backups-data` PVC (RWO, 2Gi): each writes its own artifact into its own
# subdirectory with an initContainer, then a main `rclone/rclone` container
# syncs that subdirectory to Hetzner Object Storage. RWO is per NODE, not per
# pod, so two CronJobs mounting it at once on this single-node k3s cluster is
# not a conflict; a multi-node cluster would need to pin both to the same node.
#
# `backup-secrets` carries only the account-specific values:
# `RCLONE_CONFIG_HETZNER_TYPE` and `_PROVIDER` are not credentials, so they are
# literal `env` entries on each `rclone-sync` container instead of a public
# constant sitting behind SOPS for no reason. rclone reads a remote entirely
# from `RCLONE_CONFIG_<REMOTE>_*` environment variables, so neither container
# needs a config file.
#
# Both `rclone-sync` containers guard `BACKUP_BUCKET` with `: "${BACKUP_BUCKET:?}"`
# before any upload runs: it becomes the object storage path prefix, and an
# unset value would otherwise write to the bucket root. `pg_dump` and the
# Qdrant snapshot calls fail the pod outright on a nonzero exit - no `sh -c`
# swallowing, no `|| true` - because `restartPolicy: OnFailure` and
# `concurrencyPolicy: Forbid` only mean something if a broken night is
# reported as one.
#
# `curlimages/curl` runs the Qdrant snapshot initContainer rather than the
# `qdrant/qdrant` image itself: that image carries no shell tooling worth
# relying on (`qdrant.yaml`'s own comment), so the probe uses `curl -f`
# against Qdrant's HTTP API the same way the compose healthcheck avoids it.
# `POST /snapshots` with no `wait=false` blocks until the snapshot is written
# and returns its name in the same response (`?wait=false` does not - it
# answers `{"status":"accepted"}` with no name at all, disproving the
# create-then-poll design, as found by running the real call once against the
# local stack rather than trusting an assumption). So the flow is create (synchronous, its own
# wait), then list to confirm the name it returned is really there, then
# download it - three calls, `curl -f` on every one so a 4xx/5xx cannot read
# as success.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backups-data
  namespace: platform
  labels:
    app.kubernetes.io/name: backups-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: platform
  labels:
    app.kubernetes.io/name: postgres-backup
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backup
        spec:
          restartPolicy: OnFailure
          initContainers:
            - name: pg-dump
              image: postgres:16
              envFrom:
                - secretRef:
                    name: postgres-credentials
              command:
                - sh
                - -c
                - |
                  set -eu
                  mkdir -p /backup/postgres
                  PGPASSWORD="$POSTGRES_PASSWORD" pg_dump -h postgres -Fc \
                    -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
                    -f "/backup/postgres/$(date -u +%Y%m%dT%H%M%SZ).pgdump"
              resources:
                requests:
                  memory: 64Mi
                  cpu: 50m
                limits:
                  memory: 96Mi
              volumeMounts:
                - name: backup
                  mountPath: /backup
          containers:
            - name: rclone-sync
              image: rclone/rclone:1.68.2
              env:
                - name: RCLONE_CONFIG_HETZNER_TYPE
                  value: s3
                - name: RCLONE_CONFIG_HETZNER_PROVIDER
                  value: Other
              envFrom:
                - secretRef:
                    name: backup-secrets
              command:
                - sh
                - -c
                - |
                  : "${BACKUP_BUCKET:?}"
                  rclone copy /backup/postgres "hetzner:$BACKUP_BUCKET/postgres"
              resources:
                requests:
                  memory: 64Mi
                  cpu: 50m
                limits:
                  memory: 96Mi
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: backups-data
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: qdrant-backup
  namespace: platform
  labels:
    app.kubernetes.io/name: qdrant-backup
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: qdrant-backup
        spec:
          restartPolicy: OnFailure
          initContainers:
            - name: qdrant-snapshot
              image: curlimages/curl:8.11.0
              command:
                - sh
                - -c
                - |
                  set -eu
                  mkdir -p /backup/qdrant
                  RESPONSE=$(curl -sf -X POST "http://qdrant:6333/snapshots")
                  NAME=$(echo "$RESPONSE" | grep -o '"name":"[^"]*"' | head -1 | cut -d'"' -f4)
                  [ -n "$NAME" ]
                  curl -sf "http://qdrant:6333/snapshots" | grep -q "\"$NAME\""
                  curl -sf "http://qdrant:6333/snapshots/$NAME" --output "/backup/qdrant/$NAME"
              resources:
                requests:
                  memory: 32Mi
                  cpu: 25m
                limits:
                  memory: 64Mi
              volumeMounts:
                - name: backup
                  mountPath: /backup
          containers:
            - name: rclone-sync
              image: rclone/rclone:1.68.2
              env:
                - name: RCLONE_CONFIG_HETZNER_TYPE
                  value: s3
                - name: RCLONE_CONFIG_HETZNER_PROVIDER
                  value: Other
              envFrom:
                - secretRef:
                    name: backup-secrets
              command:
                - sh
                - -c
                - |
                  : "${BACKUP_BUCKET:?}"
                  rclone copy /backup/qdrant "hetzner:$BACKUP_BUCKET/qdrant"
              resources:
                requests:
                  memory: 64Mi
                  cpu: 50m
                limits:
                  memory: 96Mi
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: backups-data
