# The three middlewares every public router applies. `traefik.io/v1alpha1` is
# Traefik v3's group, which is what k3s v1.31.5+k3s1 ships - the older
# `traefik.containo.us/v1alpha1` is v2's and is not served by this cluster.
#
# These are the originals, and they are what every copy is compared against.
# A `Middleware` is namespaced, and Traefik v3's CRD provider defaults
# `allowCrossNamespace` to false - it also treats a reference it cannot resolve
# as NO middleware rather than as an error, which on a router carrying basic
# auth is unauthenticated traffic with nothing saying so. So each namespace that
# routes public traffic carries its own copy instead of reaching in here, and a
# test pins every copy against the `spec` below field-for-field.
#
# `basic-auth` names a Secret this repo never writes: `traefik-basic-auth` is
# supplied SOPS-encrypted, with the htpasswd lines under the key `users`, once
# per namespace holding a copy.
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: basic-auth
  namespace: platform
spec:
  basicAuth:
    secret: traefik-basic-auth
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit
  namespace: platform
spec:
  # 50 requests a second sustained, bursting to 100. `period` is a duration
  # STRING: Traefik reads a bare number here as nanoseconds, which would make
  # the average effectively unbounded rather than tightening it.
  rateLimit:
    average: 50
    burst: 100
    period: 1s
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: platform
spec:
  # Exactly these five. HSTS for a year including subdomains, no MIME sniffing,
  # no framing, and a referrer policy that sends the origin cross-site rather
  # than the full URL - a gateway URL can carry a tenant and a model name.
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: strict-origin-when-cross-origin
