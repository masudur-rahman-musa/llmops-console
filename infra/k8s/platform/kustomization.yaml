# The three data services the gateway depends on, the two cert-manager issuers
# and the three Traefik middlewares every public router applies - held here as
# the originals each routing namespace copies - plus the two
# nightly backup CronJobs and their shared PVC.
#
# No `namespace:` transformer here on purpose. It would stamp
# `metadata.namespace` onto the two `ClusterIssuer`s as well - kustomize applies
# it to every document whose kind it does not know to be cluster-scoped, and a
# namespaced ClusterIssuer is silently ignored by cert-manager. Each namespaced
# file writes `metadata.namespace: platform` itself instead.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - postgres.yaml
  - redis.yaml
  - qdrant.yaml
  - cert-manager-issuers.yaml
  - traefik-middlewares.yaml
  - backup.yaml

