# Alertmanager: the one pod that turns a firing rule into an email and a
# Telegram message. One Deployment, one ConfigMap, one Service - no operator,
# no `Alertmanager` custom resource (a design note, unchanged by this plan).
#
# One route, one receiver, both channels on every alert. Nothing in
# SPEC.md or REQUIREMENTS.md asks for severity-based branching, so none is
# built: `BudgetExceeded` and `DiskSpaceLow` page the same two channels.
#
# The container port is named `metrics`, the same as every other SCRAPED pod
# in this namespace (9093 here) - not because Prometheus scrapes Alertmanager's
# own `/metrics` for this plan's dashboards (it does not, yet), but because the
# shared name is what lets the existing `metrics-ingress-from-monitoring`
# policy (`../base/networkpolicies.yaml`) admit Prometheus's alert-firing POST
# to this pod with no new ingress policy - one rule, five pods, three port
# numbers.
#
# `app.kubernetes.io/name` is written on the selector, on the pod template and
# on the Service because the root kustomization's `labels:` block carries
# `includeSelectors: false` and reaches none of them.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
data:
  # Held as a string, so a typo here is valid YAML inside a valid ConfigMap and
  # reaches the cluster unchallenged. `tests/infra/test_k8s_alerting.py` parses
  # this value and asserts the route, the receiver and both channel configs.
  #
  # Every credential is a `${VAR}` reference into the environment `envFrom`
  # sets below, never a literal - a value typed in here would be
  # a plaintext credential in a committed manifest.
  alertmanager.yml: |
    route:
      receiver: ops
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      - name: ops
        email_configs:
          - smarthost: ${SMTP_SMARTHOST}
            from: ${SMTP_FROM}
            auth_username: ${SMTP_AUTH_USERNAME}
            auth_password: ${SMTP_AUTH_PASSWORD}
            # `alertmanager-secrets` contracts no separate recipient key, so
            # this notifies the same address it sends from - a mailbox this
            # ops setup already owns and reads, not a second address to
            # provision and rotate.
            to: ${SMTP_FROM}
            send_resolved: true
        telegram_configs:
          - bot_token: ${TELEGRAM_BOT_TOKEN}
            chat_id: ${TELEGRAM_CHAT_ID}
            send_resolved: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager
    spec:
      # No `serviceAccountName`. This pod never calls the API server: its
      # config is a mounted file and its two outbound calls (SMTP, Telegram)
      # are what `alertmanager-egress` exists to allow.
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - name: metrics
              containerPort: 9093
          # The sixth Secret this repo contracts for and does not supply
          # (`../../secrets/alertmanager-secrets.example.yaml`). Until it is
          # applied the pod's receivers hold empty env vars and every
          # notification fails at send time rather than the pod failing to
          # start - Alertmanager does not validate an env-substituted value at
          # load time the way it validates the YAML's own shape.
          envFrom:
            - secretRef:
                name: alertmanager-secrets
          readinessProbe:
            httpGet:
              path: /-/ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          # The exact remainder an earlier change's budget accounting left: 32Mi of the
          # namespace's 512Mi requests, 50m of its 400m, 64Mi of its 1Gi
          # ceiling - `monitoring`'s totals now read the envelope exactly, with
          # nothing left over. No `limits.cpu`, the same reason the scrape
          # plane and Grafana declare none: a CPU limit throttles rather than
          # kills, and a throttled Alertmanager is a delayed page nobody can
          # diagnose.
          resources:
            requests:
              memory: 32Mi
              cpu: 50m
            limits:
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
              readOnly: true
            - name: data
              mountPath: /alertmanager
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        # `emptyDir`, not a claim (decision D). Losing silences and the
        # notification log across a restart of a single-replica internal tool
        # is a cost nothing in REQUIREMENTS or SPEC asks to avoid, and 23b's
        # budget accounting reserved memory and CPU for this pod but no
        # storage quota.
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: alertmanager
  ports:
    - name: metrics
      port: 9093
      targetPort: metrics
