# Prometheus: the scrape plane every dashboard, alert and nightly comparison
# reads. One Deployment, one ConfigMap, one claim and one Service - no operator,
# no CustomResourceDefinition and no `ServiceMonitor`. The whole
# build has to pass `kubeconform -strict` with no `-ignore-missing-schemas`, and
# a custom resource has no stock schema to validate against.
#
# Beyond the scrape targets, this ConfigMap carries two further keys: `rule_files`,
# naming the second data key below (`alert-rules.yml`, a copy of
# `../../infra/k8s/monitoring/alerts/rules.yml` - a `configMapGenerator` for it was not
# used, so there is exactly one ConfigMap in `monitoring` for Prometheus rather than two
# - see `infra/tests/infra/test_k8s_alerting.py`'s module docstring), and `alerting`,
# naming `Service/alertmanager`'s DNS as the one place firing alerts go. One of the
# scrape targets is `evals-pushgateway`, the Pushgateway the nightly eval workflow
# pushes `gateway_eval_*` to.
#
# Scraping is now SEVEN static targets by Service DNS, so this pod needs no
# ServiceAccount and no RBAC at all: nothing here may read the API server.
# Discovery would buy a workload opting itself in without an edit to this file
# and cost a cluster-wide read on Services, Endpoints and Pods held by the one
# pod that stores fifteen days of everything it has seen. `kube-state-metrics`
# in `exporters.yaml` is the exception and carries its own read-only
# ClusterRole, because listing objects across namespaces is the whole of what it
# does.
#
# Every container port in this namespace is NAMED `metrics`, here 9090. The
# shared name is the mechanism: one NetworkPolicy has one `podSelector` and its
# ports apply to every pod that selector matches, so one ingress rule saying
# `port: metrics` covers three pods listening on 9090, 9100 and 8080.
#
# `app.kubernetes.io/name` is written on the selector, on the pod template and
# on the Service because the root kustomization's `labels:` block carries
# `includeSelectors: false` and reaches none of them.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
data:
  # Held as a string, so a typo here is valid YAML inside a valid ConfigMap and
  # reaches the cluster unchallenged. `infra/tests/infra/test_k8s_monitoring.py`
  # parses this value and asserts the ten targets by set equality, which is the
  # only thing between a wrong Service name and a target that reads DOWN
  # forever with no error anywhere.
  #
  # Every target is fully qualified: this pod is in `monitoring` and seven of
  # the ten services are not, so a bare `gateway` resolves to nothing.
  prometheus.yml: |
    global:
      # 30s over ten targets for 30 days, capped at 3GB, fits the 4Gi claim.
      # Tightening it doubles every series' sample count against an unchanged
      # volume, and the disk fills silently.
      scrape_interval: 30s
    # `rule_files` names the second key below by its bare filename, the same
    # way this key names itself to Prometheus - both are mounted at
    # `/etc/prometheus` by the single `config` volume in the Deployment.
    rule_files:
      - alert-rules.yml
    # Where a firing alert goes. No TLS, no auth: both pods are in the same
    # namespace, behind `default-deny`, and `prometheus-egress` is the only
    # policy that opens this path.
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager.monitoring.svc.cluster.local:9093"]
    scrape_configs:
      - job_name: gateway
        metrics_path: /metrics
        static_configs:
          - targets: ["gateway.apps.svc.cluster.local:8080"]
      - job_name: qdrant
        metrics_path: /metrics
        static_configs:
          - targets: ["qdrant.platform.svc.cluster.local:6333"]
      - job_name: kube-state-metrics
        metrics_path: /metrics
        static_configs:
          - targets: ["kube-state-metrics.monitoring.svc.cluster.local:8080"]
      - job_name: node-exporter
        metrics_path: /metrics
        static_configs:
          - targets: ["node-exporter.monitoring.svc.cluster.local:9100"]
      - job_name: prometheus
        metrics_path: /metrics
        static_configs:
          - targets: ["prometheus.monitoring.svc.cluster.local:9090"]
      - job_name: cert-manager
        metrics_path: /metrics
        static_configs:
          - targets: ["cert-manager.cert-manager.svc.cluster.local:9402"]
      - job_name: evals-pushgateway
        metrics_path: /metrics
        static_configs:
          - targets: ["pushgateway.evals.svc.cluster.local:9091"]
      # The help desk's own counters: how turns end and how many chats wait
      # on a question (agent API), guardrail blocks (MCP server), and the
      # stuck chat sweep (scheduler).
      - job_name: helpdesk-agent-api
        metrics_path: /metrics
        static_configs:
          - targets: ["helpdesk-agent-api.apps.svc.cluster.local:8000"]
      - job_name: helpdesk-mcp-server
        metrics_path: /metrics
        static_configs:
          - targets: ["helpdesk-mcp-server.apps.svc.cluster.local:8081"]
      - job_name: helpdesk-scheduler
        metrics_path: /metrics
        static_configs:
          - targets: ["helpdesk-scheduler.apps.svc.cluster.local:8082"]
  # A literal copy of `../../infra/k8s/monitoring/alerts/rules.yml`. Held as
  # its own key, mounted next to `prometheus.yml` in the same ConfigMap, rather
  # than a `configMapGenerator` of its own - the same object-count reasoning
  # that keeps the dashboards in one generated ConfigMap applies here to keep
  # `monitoring`'s inventory small
  # (`infra/tests/infra/test_k8s_alerting.py::test_the_monitoring_namespace_emits_alertmanager_and_nothing_else_new`).
  # A second copy is the tradeoff: nothing here enforces the two staying
  # byte-identical, the same limitation the duplicated
  # dashboards path has.
  alert-rules.yml: |
    groups:
      - name: gateway
        rules:
          - alert: GatewayDown
            expr: up{job="gateway"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: The gateway has been unreachable by its own scrape target for 2 minutes.

          - alert: HighErrorRate
            expr: |
              sum(rate(gateway_requests_total{status=~"5.."}[10m]))
              /
              sum(rate(gateway_requests_total[10m]))
              > 0.02
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: More than 2% of gateway requests have returned a 5xx status over 10 minutes.

          - alert: LatencyOverSLO
            expr: |
              histogram_quantile(
                0.95,
                sum(rate(gateway_request_latency_seconds_bucket[5m])) by (le)
              ) > 6
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: The gateway's p95 request latency has stayed above 6 seconds for 15 minutes.

          - alert: ProviderCircuitOpen
            expr: gateway_circuit_state == 2
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: A provider's circuit breaker has stayed open for 5 minutes.

          - alert: BudgetWarning
            expr: gateway_budget_ratio >= 0.8
            labels:
              severity: warning
            annotations:
              summary: A tenant has consumed at least 80% of its period budget.

          - alert: BudgetExceeded
            expr: gateway_budget_ratio >= 1.0
            labels:
              severity: critical
            annotations:
              summary: A tenant has consumed its entire period budget.

          - alert: NightlyEvalRegression
            expr: gateway_eval_check_score - quantile_over_time(0.5, gateway_eval_check_score[7d]) < -2
            labels:
              severity: warning
            annotations:
              summary: The nightly eval's check score dropped more than 2 points against its 7-day median.

          - alert: DiskSpaceLow
            expr: node_filesystem_avail_bytes{fstype!="tmpfs"} / node_filesystem_size_bytes{fstype!="tmpfs"} < 0.2
            labels:
              severity: warning
            annotations:
              summary: A node's free disk space has dropped below 20% on a real filesystem.

          - alert: PodCrashLooping
            expr: increase(kube_pod_container_status_restarts_total[15m]) >= 3
            labels:
              severity: warning
            annotations:
              summary: A container has restarted 3 or more times in the last 15 minutes.

          - alert: BackupJobFailed
            expr: kube_job_status_failed{job_name=~".*-backup.*"} > 0
            labels:
              severity: critical
            annotations:
              summary: A backup CronJob's Job has failed.

          - alert: CertificateExpiringSoon
            expr: certmanager_certificate_expiration_timestamp_seconds - time() < 14 * 86400
            labels:
              severity: warning
            annotations:
              summary: A cert-manager certificate expires in less than 14 days.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 4Gi
  # `storageClassName` deliberately absent, the same reason `platform`'s
  # Postgres and `apps`'s llama.cpp embedding claim omit it: k3s defaults to `local-path`
  # and EKS to `gp2`, and the manifest stays portable between the two.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
spec:
  replicas: 1
  # `Recreate`, not the default rolling update. The claim is `ReadWriteOnce`, so
  # a rolling update is a new pod waiting forever for a volume the old pod still
  # holds, with the rollout stuck and the old pod still scraping.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
    spec:
      # No `serviceAccountName`. The pod gets the namespace's `default`
      # ServiceAccount, which is bound to nothing, and static targets mean it
      # never calls the API server at all.
      containers:
        - name: prometheus
          image: prom/prometheus:v3.1.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            # 30 days because the SLO error budgets read a fixed [30d] window.
            # The size cap keeps that inside the 4Gi claim: past 3GB the oldest
            # blocks go first, before the disk fills.
            - --storage.tsdb.retention.time=30d
            - --storage.tsdb.retention.size=3GB
          ports:
            - name: metrics
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          # 256Mi of the namespace's 512Mi of requests, and 512Mi of its 1Gi
          # ceiling. No `limits.cpu`: a CPU limit throttles rather than kills,
          # and a throttled scraper drops samples rather than failing visibly.
          resources:
            requests:
              memory: 256Mi
              cpu: 150m
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
