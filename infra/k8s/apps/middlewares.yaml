# The same three middlewares `../platform/traefik-middlewares.yaml` declares,
# copied into `apps` rather than referenced across namespaces.
#
# Traefik v3's CRD provider defaults `allowCrossNamespace` to false, so an
# Ingress in `apps` naming `platform-basic-auth@kubernetescrd` would resolve to
# nothing - and Traefik treats an unresolvable middleware reference as NO
# middleware rather than as an error, which on the `/` router is unauthenticated
# traffic with nothing anywhere saying so. Nothing has applied this cluster, so
# the first apply would be the first test of it. The copy removes the question.
#
# The duplication is mechanical, not a second thing to maintain:
# `tests/infra/test_k8s_apps.py::test_each_apps_middleware_matches_its_platform_original`
# compares each `spec` here against its `platform` original field-for-field, both
# sides read off the same build, so the two cannot drift silently in either
# direction.
#
# Every value below is therefore a copy. The comments explaining WHY each value
# is what it is live once, beside the original.
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: basic-auth
  namespace: apps
spec:
  basicAuth:
    secret: traefik-basic-auth
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit
  namespace: apps
spec:
  rateLimit:
    average: 50
    burst: 100
    period: 1s
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: apps
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: strict-origin-when-cross-origin
---
# The one middleware here with no `platform` original: the console login's own
# limit, which is why the copy check above excludes it by name.
# Five a minute per source address with a burst of five. `period` is
# int-or-string in the Traefik CRD k3s pins, so `1m` is a duration.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: console-login-rate-limit
  namespace: apps
spec:
  rateLimit:
    average: 5
    period: 1m
    burst: 5
