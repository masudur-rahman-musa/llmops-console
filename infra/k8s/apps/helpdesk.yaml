# The four Helpdesk workloads: the companion repo's agent API, its MCP tool
# server, its scheduler and its web front end. They are CLIENTS of the gateway
# in `gateway.yaml`, not providers of it, so nothing here touches `routing.yaml`
# or the provider files - the Helpdesk reaches this cluster's models the same way any
# other caller does, over `GATEWAY_URL`.
#
# All four are written INTO the `Helpdesk reserve, 3 pods` envelope
# `../README.md` has held since row 20a - 576Mi of requests, 300m of CPU, 1152Mi
# of limits - rather than on top of it, so the apps budget's three totals do not
# move and `../base/quotas.yaml` is untouched. That costs something and the
# README says what: the agent-api keeps the reserve's own 192Mi and the other
# three take 128Mi, so the agent-api is the only Helpdesk pod sized for real
# traffic. If one of the other three needs more, the conversation is that table.
#
# No `limits.cpu` on any of the four. A CPU limit throttles rather than kills,
# and the agent-api is the workload the design puts a tail-latency SLO on.
#
# Decision B - which of these is public: `helpdesk-web` alone, through the
# `helpdesk.` Ingress pair in `ingress.yaml`. All three Services stay ClusterIP
# and the other two are reachable in-cluster only. A browser reaching the agent-api
# directly is the shape a project rule rejects for the console, and the MCP server
# is a tool endpoint that no host should resolve to.
#
# Decision E - the env contract. The names below are the companion repo's
# published ones: bare and unprefixed, one name per value, read from its
# `.env.example`. `../README.md`'s "What the Helpdesk reads" table mirrors them.
# The risk is unchanged: a name that drifts on either side leaves the pod
# starting on its localhost default rather than failing loudly, because a
# missing variable is usually a default and not a crash.
#
# Bare names share a namespace with every other `envFrom` in the pod, which is
# why only these four Deployments mount `helpdesk-config` and `helpdesk-secrets`.
# A gateway pod reading this `REDIS_URL` or `ENV` would silently change
# behaviour; `test_only_helpdesk_workloads_mount_the_helpdesk_sources` pins it.
#
# All four share one ConfigMap and one Secret, so `helpdesk-web` also sees
# `JWT_SECRET` and the database DSN it never uses. Per-workload `secretKeyRef`
# would close that; it is a separate least-privilege change.
#
# Decision F - the scheduler has no ports and no probes. It serves nothing: it
# holds a Redis leader lock and runs jobs, so `replicas: 1` with `Recreate` is
# what keeps exactly one copy through a rollout, and inventing a health port or
# an exec probe for a process no code in this repo defines would be worse than
# the gap - a liveness probe against a command that does not exist restarts the
# pod forever. What it costs is stated rather than half-fixed: a wedged
# scheduler is visible in kube-state-metrics from row 23a, and row 23c's
# `PodCrashLooping` alert pages on a container that keeps RESTARTING - a
# scheduler that hangs without crashing still trips no alert at all, since
# nothing here reads a liveness signal it does not have.
#
# `helpdesk-secrets` is NAMED here and supplied nowhere in this repo. It carries
# the gateway API keys the Helpdesk calls with, its own database DSN, its JWT
# signing secret and the Langfuse pair, SOPS-encrypted before the first apply,
# and until it exists an apply fails on the missing Secret - which is the
# intended direction.
#
# The images are set by `kustomization.yaml`'s `images:` transformer, not here.
# The companion repo publishes them as PRIVATE GHCR packages, so each of the four
# pod specs names `ghcr-pull` (`../../secrets/ghcr-pull.example.yaml`), a
# `read:packages` token. It sits on these pod specs rather than on the `apps`
# default ServiceAccount, so the gateway and console pods never carry it.
# The tag is the full commit SHA that repo's `build.yml` published, and it
# publishes no `latest`: `deploy.yml` here rewrites the `gateway` tag only, so
# the Helpdesk's own deploy is a bump of that SHA in `kustomization.yaml`.
#
# `app.kubernetes.io/name` is written three times per serving workload - on the
# selector, on the pod template and on the Service - because the root
# kustomization's `labels:` block carries `includeSelectors: false` and reaches
# none of them. Nothing else is written into a selector: a label that reaches
# one is immutable after the first apply.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: helpdesk-config
  namespace: apps
  labels:
    app.kubernetes.io/name: helpdesk
data:
  # In-cluster addresses, every host fully qualified: these pods are in `apps`
  # and two of the three services are in `platform`, so a bare `redis` resolves
  # to nothing.
  GATEWAY_URL: http://gateway.apps.svc.cluster.local:8080/v1
  # Redis database `1`, not the gateway's `0`. One Redis, two tenants of it, and
  # a shared index is one `FLUSHDB` away from taking out the other repo's state.
  REDIS_URL: redis://redis.platform.svc.cluster.local:6379/1
  QDRANT_URL: http://qdrant.platform.svc.cluster.local:6333
  ENV: production
  # The two internal Helpdesk endpoints, each on its own Service's port below.
  # The agent API calls the MCP server; the web pod calls the agent API from its
  # server side only, never from the browser.
  MCP_URL: http://helpdesk-mcp-server.apps.svc.cluster.local:8081/mcp
  AGENT_API_URL: http://helpdesk-agent-api.apps.svc.cluster.local:8000
  # The one public address here: the host of Ingress `helpdesk` in
  # `ingress.yaml`, scheme and host only with no trailing slash, as the companion
  # repo's contract states it. The agent API reads it; the test that pins it
  # reads the host off the built Ingress, so the two cannot drift apart.
  WEB_ORIGIN: https://helpdesk.example.com
  # Quoted: a ConfigMap value is a string, and a bare `true` fails the apply.
  SESSION_COOKIE_SECURE: "true"
  # The corpus root the MCP server walks, as `{tenant}/{version}/{file}`. The
  # companion repo's image carries NO corpus: it expects a read-only mount at
  # this path, so a compromised tool process cannot edit what decides access.
  # Nothing in this repo supplies that volume yet, so the MCP server finds an
  # empty root and retrieves nothing until it does. The value is the path its
  # own compose file mounts at, so the two agree when the volume lands.
  POLICY_DIR: /srv/policies
  # `OTEL_SERVICE_NAME` is deliberately NOT here. It is per-container
  # `env` below, because one trace carries spans from the Helpdesk and from the
  # gateway, and a shared name collapses four processes into one service in the
  # viewer - a failure no trace test would catch.
---
# The policy corpus the MCP server retrieves from, walked as
# `{tenant}/{version}/{file}`. It is a CLAIM and not a ConfigMap for two reasons:
# the corpus is the companion repo's data and belongs in neither this repo's git
# history nor its manifests, and a ConfigMap caps at 1Mi, which a real corpus
# outgrows without warning.
#
# Nothing here populates it. The owner loads the corpus once, then re-runs the
# companion repo's ingest against the same mount, so the volume and the vector
# store agree; `../README.md` carries the two commands. An empty claim is the
# honest failure: retrieval returns nothing, rather than the MCP server answering
# from a corpus nobody chose.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: helpdesk-policies
  namespace: apps
  labels:
    app.kubernetes.io/name: helpdesk
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 256Mi
  # `storageClassName` is deliberately absent, the same reason `llama-embed.yaml`'s
  # claim omits it: k3s defaults to `local-path` and EKS to `gp2`, so one build
  # deploys to both without leaving a Pending claim on a class that is not there.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helpdesk-agent-api
  namespace: apps
  labels:
    app.kubernetes.io/name: helpdesk-agent-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: helpdesk-agent-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: helpdesk-agent-api
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: helpdesk-agent-api
          image: helpdesk-agent-api
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: helpdesk-config
            - secretRef:
                name: helpdesk-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: helpdesk-agent-api
          # `/readyz` is dependencies reachable and `/healthz` is process up.
          # Swapped, `/readyz` as liveness restarts the pod every time Redis
          # blips and `/healthz` as readiness sends traffic to a process with no
          # database.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          # The reserve's own per-pod row: the one Helpdesk workload sized for
          # real traffic (decision A).
          resources:
            requests:
              memory: 192Mi
              cpu: 100m
            limits:
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: helpdesk-agent-api
  namespace: apps
  labels:
    app.kubernetes.io/name: helpdesk-agent-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: helpdesk-agent-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helpdesk-mcp-server
  namespace: apps
  labels:
    app.kubernetes.io/name: helpdesk-mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: helpdesk-mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: helpdesk-mcp-server
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: helpdesk-mcp-server
          image: helpdesk-mcp-server
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: helpdesk-config
            - secretRef:
                name: helpdesk-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: helpdesk-mcp-server
          # Read-only, and only here: `POLICY_DIR` is read by this workload and
          # by the ingest, and a corpus a tool process can WRITE is a corpus that
          # decides access and can be edited by whatever compromises that
          # process. The path is `helpdesk-config`'s `POLICY_DIR` value; the test
          # reads it off the built ConfigMap rather than repeating it.
          volumeMounts:
            - name: policies
              mountPath: /srv/policies
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              memory: 128Mi
              cpu: 75m
            limits:
              memory: 256Mi
      volumes:
        - name: policies
          persistentVolumeClaim:
            claimName: helpdesk-policies
---
apiVersion: v1
kind: Service
metadata:
  name: helpdesk-mcp-server
  namespace: apps
  labels:
    app.kubernetes.io/name: helpdesk-mcp-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: helpdesk-mcp-server
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helpdesk-web
  namespace: apps
  labels:
    app.kubernetes.io/name: helpdesk-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: helpdesk-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: helpdesk-web
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: helpdesk-web
          image: helpdesk-web
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: helpdesk-config
            - secretRef:
                name: helpdesk-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: helpdesk-web
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              memory: 128Mi
              cpu: 75m
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: helpdesk-web
  namespace: apps
  labels:
    app.kubernetes.io/name: helpdesk-web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: helpdesk-web
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helpdesk-scheduler
  namespace: apps
  labels:
    app.kubernetes.io/name: helpdesk-scheduler
spec:
  replicas: 1
  # `Recreate`, not `RollingUpdate`: the rolling default starts the new pod
  # before the old one stops, which is two schedulers for the length of every
  # deploy. The Redis leader lock the design names is what makes a brief second
  # copy survivable if one ever happens; it is not a reason to arrange for one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: helpdesk-scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: helpdesk-scheduler
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: helpdesk-scheduler
          image: helpdesk-scheduler
          # Still no probes (decision F): it serves no traffic. It does serve
          # its stuck chat counters on 8082, so that port and the Service
          # below exist for Prometheus to scrape, and for nothing else.
          ports:
            - name: metrics
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: helpdesk-config
            - secretRef:
                name: helpdesk-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: helpdesk-scheduler
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi

---
# Only for the metrics scrape: Prometheus reaches the scheduler's counters by
# this name. Nothing else calls the scheduler.
apiVersion: v1
kind: Service
metadata:
  name: helpdesk-scheduler
  namespace: apps
  labels:
    app.kubernetes.io/name: helpdesk-scheduler
spec:
  selector:
    app.kubernetes.io/name: helpdesk-scheduler
  ports:
    - name: metrics
      port: 8082
      targetPort: metrics
