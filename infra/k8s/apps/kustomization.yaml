# The gateway, the llama.cpp embedding server, the four Helpdesk workloads and the
# four public routers - the `api.` pair and the `helpdesk.` pair, both in
# `ingress.yaml` - and the console with its three `console.` routers, in
# `console.yaml`.
#
# No `namespace:` transformer, for the same reason `../platform` has none: it
# would stamp `metadata.namespace` onto anything kustomize does not know to be
# cluster-scoped. Each file writes `metadata.namespace: apps` itself.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - gateway.yaml
  - llama-embed.yaml
  - helpdesk.yaml
  - console.yaml
  - middlewares.yaml
  - ingress.yaml

# The Deployment writes a bare `gateway`, which nothing can pull, so a manifest
# applied without this transformer fails on the pull rather than running
# something nobody chose. `0.0.0-unbuilt` is the honest placeholder: `build.yml`
# pushes an image tagged with the commit SHA on every push to `main`,
# and this overlay is never told which of them to run: `deploy.yml` rewrites the
# tag to the deployed SHA with `kustomize edit set image` in the runner and
# commits nothing back, so this value stays `0.0.0-unbuilt` in git for good.
# A `latest` or a `main` here would be a cluster whose running code no commit
# names, and a rollout that changes meaning with no diff to show for it.
#
# The llama.cpp embedding pod writes the bare name `llama` and uses the entry
# below, which is pinned to an exact upstream build for the same reason, and
# `docker-compose.yml` names the same one so the two stacks run the same server.
# Upstream's `server` tag floats: it is whatever the last build published, so a
# cluster on it runs code no commit here names. `server-b10902` was resolved
# against GHCR at implementation time and its index carries linux/arm64, which
# the CAX21 needs.
images:
  - name: gateway
    newName: ghcr.io/masudur-rahman-musa/llmops-console/gateway
    newTag: 0.0.0-unbuilt
  # The console, built by `build.yml`'s `console` job and set by `deploy.yml`
  # beside the gateway, on the same terms.
  - name: console
    newName: ghcr.io/masudur-rahman-musa/llmops-console/console
    newTag: 0.0.0-unbuilt
  - name: llama
    newName: ghcr.io/ggml-org/llama.cpp
    newTag: server-b10902
  # The four Helpdesk workloads, each its own image out of the companion repo's
  # registry, private, pulled with `ghcr-pull` (`helpdesk.yaml`). That repo's
  # `build.yml` publishes on every push to `main`, tagging each image with the
  # full commit SHA and nothing else - there is no `latest` to fall back to, so
  # this tag is a SHA or the apply fails on the pull.
  #
  # The SHA below is that repo's `main` head. Bumping it is how the Helpdesk
  # deploys: `deploy.yml` here rewrites the `gateway` tag only and never touches
  # these four.
  - name: helpdesk-agent-api
    newName: ghcr.io/masudur-rahman-musa/helpdesk-agentic-flow/helpdesk-agent-api
    newTag: 29a61ef774e7ebf4fe8cc173de44c2352555a66e
  - name: helpdesk-mcp-server
    newName: ghcr.io/masudur-rahman-musa/helpdesk-agentic-flow/helpdesk-mcp-server
    newTag: 29a61ef774e7ebf4fe8cc173de44c2352555a66e
  - name: helpdesk-scheduler
    newName: ghcr.io/masudur-rahman-musa/helpdesk-agentic-flow/helpdesk-scheduler
    newTag: 29a61ef774e7ebf4fe8cc173de44c2352555a66e
  - name: helpdesk-web
    newName: ghcr.io/masudur-rahman-musa/helpdesk-agentic-flow/helpdesk-web
    newTag: 29a61ef774e7ebf4fe8cc173de44c2352555a66e
