# llama.cpp: the `local` provider in `routing.yaml`, and the only place an EU
# tenant's `pii` traffic is allowed to land. The gateway reaches it as
# `http://llama:8082/v1`, which is a BARE name - it resolves only because both
# workloads sit in `apps`, so the Service's NAME and PORT are fixed by the
# shipped policy rather than chosen here. Renaming either stops the shipped
# `routing.yaml` resolving in the cluster with nothing in this file to show for
# it, which is why a test derives both from `providers.local.base_url`.
#
# One process serves ONE model, so this pod cannot answer an embedding. The
# `embed` alias resolves to `local_embed` and a second server, `llama-embed.yaml`
# beside this file - so `/v1/embeddings` and the semantic cache probe are that
# pod's, and nothing here answers for them.
#
# A 3B Q4_K_M, not the 7B the repo named until now: this pod's ceiling is 3 GiB
# and a 7B Q4_K_M is ~4.4 GB before its KV cache. Serving a 3B file under the 7B
# name would put a model that never ran on every ledger row and in every
# `X-Gateway-Model` header.
#
# The weights are not in the image and no container downloads them: a 5Gi claim,
# mounted read-only, filled by the human step in `../README.md`. Until it is
# filled the pod fails its startup probe and says so - a visibly unready
# workload rather than a silent one.
#
# `app.kubernetes.io/name` is written on the selector, on the pod template and
# on the Service because the root kustomization's `labels:` block carries
# `includeSelectors: false` and reaches none of them.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llama-models
  namespace: apps
  labels:
    app.kubernetes.io/name: llama
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
  # `storageClassName` is deliberately absent, the same reason `platform`'s
  # Postgres omits it: k3s defaults to `local-path` and EKS to `gp2`, so one
  # build deploys to both without leaving a Pending claim on a class that does
  # not exist there.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama
  namespace: apps
  labels:
    app.kubernetes.io/name: llama
spec:
  replicas: 1
  # `Recreate`, not the default rolling update. The claim is `ReadWriteOnce`, so
  # a rolling update is a new pod waiting for a volume the old pod still holds -
  # forever, with the rollout stuck and the old pod still serving.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: llama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llama
    spec:
      containers:
        - name: llama
          # Replaced wholesale by `kustomization.yaml`'s `images:` transformer.
          # Left as a bare name so an apply made without that transformer fails
          # on a pull rather than quietly running something nobody chose.
          image: llama
          # the design's numbers, not compose's. `--ctx-size 8192` and no
          # `--parallel` is a developer's laptop; this is a CAX21 sharing four
          # cores with the gateway.
          args:
            - --host
            - 0.0.0.0
            - --port
            - "8082"
            - --ctx-size
            - "4096"
            - --parallel
            - "2"
            - -m
            - /models/qwen2.5-3b-instruct-q4_k_m.gguf
          ports:
            - name: http
              containerPort: 8082
          # The startup probe is what makes the liveness probe safe: liveness
          # cannot fire until startup has passed, so 600 seconds (10s x 60) of
          # first load off a cold disk restarts nothing. A long
          # `initialDelaySeconds` on liveness instead would kill the pod
          # mid-load on a slower disk, which is a crash loop that never finishes
          # loading once.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          # The reserve `../README.md` already prices, unchanged: no total in
          # that table and no column of `base/quotas.yaml` moves for this file.
          # No `limits.cpu` - a CPU limit throttles rather than kills, and token
          # generation is the workload that would pay for it.
          resources:
            requests:
              memory: 1024Mi
              cpu: 300m
            limits:
              memory: 3072Mi
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llama-models
---
apiVersion: v1
kind: Service
metadata:
  name: llama
  namespace: apps
  labels:
    app.kubernetes.io/name: llama
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: llama
  ports:
    - name: http
      port: 8082
      targetPort: http
