# The nightly run of REQUIREMENTS #43, SPEC line 291's "02:00 Europe/Berlin" written as
# `0 2 * * *` - this cluster's clock is UTC (nothing here configures a k3s timezone), so
# the schedule runs at 02:00 UTC rather than at the Berlin wall-clock time the spec names;
# correcting that is a k3s-wide TZ decision, not this row's to make.
#
# `image: ghcr.io/masudur-rahman-musa/ai-operations-console/gateway:0.0.0-unbuilt` is written OUT
# IN FULL rather than as the bare name `apps/kustomization.yaml`'s `images:` transformer
# rewrites - that transformer only reaches the resources listed in `apps/kustomization.yaml`
# itself, and this CronJob lives in a sibling kustomization (`evals/`) it never sees. A
# second `images:` entry here would look like the same mechanism while never being touched
# by `deploy.yml`, which runs `kustomize edit set image` inside `infra/k8s/apps` only
# (decision, a project rule: repetition the reader can SEE beats an indirection that
# silently never fires) - so this tag is a second manual edit deploy.yml does not make yet,
# joining the gap the project notes already names for the four Helpdesk images.
#
# `ops-eval` is a `[project.scripts]` entry point already installed in that image
# (`pyproject.toml`), so no second image exists for this job to run. This manifest is
# honest about being currently inert beyond that: no image has been published under this
# path yet, and the gateway image's own `Dockerfile`
# does not `COPY` `backend/evals/`, so `--set` names a path nothing in the container
# actually carries until a later plan closes that gap too - the same "ships correct but
# inert" shape `eval-gate.yml` and `deploy.yml` already carry.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-eval
  namespace: evals
  labels:
    app.kubernetes.io/name: nightly-eval
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: nightly-eval
        spec:
          restartPolicy: OnFailure
          containers:
            - name: nightly-eval
              image: ghcr.io/masudur-rahman-musa/ai-operations-console/gateway:0.0.0-unbuilt
              envFrom:
                - secretRef:
                    name: evals-secrets
              command:
                - ops-eval
                - run
                - --target
                - http://gateway.apps.svc.cluster.local
                - --set
                - backend/evals/golden/example.jsonl
                - --tenant
                - evals
                - --run-kind
                - nightly
                - --out
                - /tmp/reports
                - --pushgateway-url
                - http://pushgateway.evals.svc.cluster.local:9091
              resources:
                requests:
                  memory: 128Mi
                  cpu: 100m
                limits:
                  memory: 256Mi
