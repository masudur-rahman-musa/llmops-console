# The Pushgateway. The nightly eval runs from a GitHub workflow, not from the cluster.
#
# No `namespace:` transformer, for the same reason `../platform` and `../apps` have none:
# each file writes `metadata.namespace: evals` itself.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - pushgateway.yaml
