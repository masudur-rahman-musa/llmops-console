# The Pushgateway: where the nightly-eval CronJob (`nightly-eval-cronjob.yaml`) puts
# `gateway_eval_*` after each run, and the one thing Prometheus itself scrapes in this
# namespace (`infra/k8s/monitoring/prometheus.yaml`'s new `evals-pushgateway` job).
#
# `core/metrics.py` deliberately never registers `gateway_eval_*` (its own docstring
# says so): a value pushed here lives only as long as this Deployment keeps it in memory,
# between the CronJob's nightly PUT and Prometheus's next scrape - long enough for the
# scrape to see it, never a database.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pushgateway
  namespace: evals
  labels:
    app.kubernetes.io/name: pushgateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pushgateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pushgateway
    spec:
      containers:
        - name: pushgateway
          image: prom/pushgateway:v1.11.3
          ports:
            - name: metrics
              containerPort: 9091
          readinessProbe:
            httpGet:
              path: /-/ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              memory: 32Mi
              cpu: 25m
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pushgateway
  namespace: evals
  labels:
    app.kubernetes.io/name: pushgateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pushgateway
  ports:
    - name: metrics
      port: 9091
      targetPort: metrics
