# The four namespaces, and the only four: the tests assert set EQUALITY, so a
# fifth added here reddens rather than arriving quietly.
#
# The split is by blast radius, not by tidiness. `platform` holds the stateful
# backing services and the cluster's own machinery, `apps` the gateway and
# everything else that serves a request - the two llama.cpp servers, the four
# Helpdesk workloads and, still to land, the console - `evals` the eval
# Pushgateway, `monitoring` the metrics stack. The
# NetworkPolicies key off exactly these names.
#
# No labels are set on these objects. The root kustomization's `labels:` block
# is the only source, and a pair repeated here would be indistinguishable from
# one the root stopped setting.
---
apiVersion: v1
kind: Namespace
metadata:
  name: platform
---
apiVersion: v1
kind: Namespace
metadata:
  name: apps
---
apiVersion: v1
kind: Namespace
metadata:
  name: evals
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
