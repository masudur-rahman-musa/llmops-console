# The envelope, and the reason this plan exists before the workloads do.
#
# A ResourceQuota that NAMES a resource makes the API server reject any pod in
# that namespace whose containers do not declare it. So naming `requests.memory`
# and `limits.memory` turns "requests and limits on everything" into a property
# admission enforces, rather than one a reviewer has to re-check workload by
# workload as each one lands.
#
# `limits.cpu` is deliberately absent: a CPU limit
# throttles rather than kills, so forcing one onto every container would cost
# the gateway tail latency and buy no safety. The four requests total 6Gi and
# 3 CPU exactly, inside the CAX21's 8 GiB and 4 vCPU, leaving both a memory and
# a CPU margin for k3s itself. The limits column is oversubscribed (12Gi) on
# purpose: requests are what the scheduler packs, limits are the ceiling one
# container may burst to, and llama.cpp alone carries a 3 GiB limit.
#
# `apps` holds 7Gi of that column. What it has to fit - the gateway at its HPA
# ceiling, the two llama.cpp servers, the four Helpdesk workloads and the
# console - totals 6784Mi of limits, and trimming llama.cpp's ceiling to fit
# less would contradict the 3 GiB it is sized for. The requests column is the
# one the scheduler enforces, and its 6Gi total is what the box actually has to
# hold.
#
# Raising any row means re-totalling it here AND in `../README.md`. `monitoring`
# is the one with the least room left: an earlier change's Prometheus and two exporters
# spend 352Mi of its 512Mi, which leaves Grafana (23b) and Alertmanager (23c)
# exactly 160Mi between them and no slack.
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: platform-envelope
  namespace: platform
spec:
  hard:
    requests.memory: 2Gi
    requests.cpu: 800m
    limits.memory: 3Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: apps-envelope
  namespace: apps
spec:
  hard:
    requests.memory: 3Gi
    requests.cpu: 1500m
    limits.memory: 7Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: evals-envelope
  namespace: evals
spec:
  hard:
    requests.memory: 512Mi
    requests.cpu: 300m
    limits.memory: 1Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: monitoring-envelope
  namespace: monitoring
spec:
  hard:
    requests.memory: 512Mi
    requests.cpu: 400m
    limits.memory: 1Gi
