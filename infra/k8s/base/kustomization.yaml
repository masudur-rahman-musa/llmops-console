# The four namespaces, the envelope every later workload is admitted against
# and the NetworkPolicies that say what may reach what. No labels here: the
# root sets them once for every directory (see `../kustomization.yaml`).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespaces.yaml
  - quotas.yaml
  - limitranges.yaml
  - networkpolicies.yaml
