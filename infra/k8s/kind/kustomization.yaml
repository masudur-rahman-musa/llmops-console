# The kind e2e's own kustomization. Base plus three of
# `platform`'s files plus a trimmed `apps` set - never `infra/k8s/apps` or
# `infra/k8s/platform` whole, and never the root `infra/k8s`, which is what the
# production build and this one would otherwise have to stay in step over.
#
# `infra/k8s/platform`'s OTHER three files are left out because a bare `kind`
# cluster has neither cert-manager nor Traefik installed: `cert-manager-issuers.yaml`
# (a `ClusterIssuer`) and `traefik-middlewares.yaml` (a `Middleware`) both name CRDs
# no bare kind cluster carries, and `kubectl apply` of an object naming an absent
# CRD fails the WHOLE apply rather than skipping just that object - not a matter of
# taste, the same reason this overlay carries no Ingress at all. `backup.yaml` is
# left out too: its two CronJobs read a `backup-secrets` this overlay does not
# supply, and it proves nothing this plan's ten cases need.
#
# `infra/k8s/apps/helpdesk.yaml`, `middlewares.yaml` and `ingress.yaml` are left out
# for the acceptance criteria's own reason: the four Helpdesk images and
# `services/console` do not exist anywhere to pull (STATUS's Known issues), and kind
# has no DNS/TLS/basic-auth path for an Ingress to exercise.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../infra/k8s/base
  - ../../../infra/k8s/platform/postgres.yaml
  - ../../../infra/k8s/platform/redis.yaml
  - ../../../infra/k8s/platform/qdrant.yaml
  - ../../../infra/k8s/apps/gateway.yaml
  - gateway-secrets.yaml
  - eval-target-stub-secrets.yaml
  - postgres-credentials.yaml
  - stub.yaml

# The stub plays the same small case file `ops-eval conversations` plays, so the file
# is read from `backend/evals/` here rather than copied (the relaxed load restrictor
# the workflow already uses allows it). The name has no hash suffix: `stub.yaml` names it.
configMapGenerator:
  - name: eval-target-stub-cases
    namespace: apps
    files:
      - kind-cases.jsonl=../../../backend/evals/kind-cases.jsonl
generatorOptions:
  disableNameSuffixHash: true

# `llama.yaml` and `llama-embed.yaml` are out while the local model is out of use
# (2026-10-12): on a 2-CPU runner the chat weight never finished downloading and
# the embedding weight was never fetched, so the run checks `smoke.sh`'s
# model-free paths instead. To bring them back, re-add both files and
# `llama-model-init-patch.yaml` (kept in this directory) as a patch on `llama`.
#
# These patches fit the build onto one kind node on a 2-CPU runner, where
# qdrant-0 sat Pending on "Insufficient cpu": one gateway and no HPA (the server
# build's own shape), and the CPU REQUESTS of Postgres and Qdrant cut to 50m. A
# request only reserves scheduling room; the limits, and production, are untouched.
patches:
  - patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: gateway
        namespace: apps
      $patch: delete
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: gateway
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 50m
    target:
      kind: StatefulSet
      name: postgres|qdrant

# `gateway`'s tag names what THIS workflow builds and `kind load docker-image`s
# rather than `build.yml`'s published SHA (plan decision D: no dependency on GHCR
# from a PR run). `eval-target-stub` has no production counterpart to copy a tag
# from at all.
images:
  - name: gateway
    newTag: e2e-kind
  - name: eval-target-stub
    newTag: e2e-kind
