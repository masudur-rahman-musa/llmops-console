# The CI-only `gateway-secrets`, plain rather than SOPS-encrypted (unlike
# `infra/secrets/gateway-secrets.example.yaml`'s contract): the kind cluster this
# applies into is created and destroyed inside one workflow run, so there is
# nothing here worth encrypting - a throwaway tenant key, never a provider key.
#
# `OPSCONSOLE_API_KEYS` is the only key this Secret carries. Every other field the
# real contract lists (`OPSCONSOLE_ADMIN_KEY_SHA256`, the provider keys, the OTLP
# pair) is simply ABSENT, which is what leaves every setting at its documented
# empty default rather than a placeholder that widens something. In particular:
# no `ANTHROPIC_API_KEY` or `OPENAI_API_KEY` means the gateway builds only
# `local_embed` - the one shipped provider file with no `key_env` - so no chat
# request can reach a paid provider from CI
# (`infra/tests/infra/test_k8s_ci_kind_overlay.py`'s
# `test_no_chat_provider_is_reachable_without_a_key`).
#
# `evals:<sha256>` is the digest of the plaintext key
# `eval-target-stub-secrets.yaml` hands to the stub - a fixed, published,
# worthless CI constant, the same shape `tests/gateway/conftest.py`'s test keys
# already are, never a real credential.
apiVersion: v1
kind: Secret
metadata:
  name: gateway-secrets
  namespace: apps
type: Opaque
stringData:
  OPSCONSOLE_API_KEYS: "evals:4d580b7d0bef73bbdc760e338f2e48ec013ae781661acf30e8c20f31ae6d418b"
