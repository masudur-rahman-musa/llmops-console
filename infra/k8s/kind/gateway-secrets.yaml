# The CI-only `gateway-secrets`, plain rather than SOPS-encrypted (unlike
# `infra/secrets/gateway-secrets.example.yaml`'s contract): the kind cluster this
# applies into is created and destroyed inside one workflow run, so there is
# nothing here worth encrypting - a throwaway tenant key, never a provider key.
#
# `OPSCONSOLE_API_KEYS` is the only key this Secret carries. Every other field the
# real contract lists (`OPSCONSOLE_ADMIN_KEY_SHA256`, the provider keys, the OTLP
# pair) is simply ABSENT, which is what leaves every setting at its documented
# empty default rather than a placeholder that widens something. In particular:
# no `ANTHROPIC_API_KEY`, `ANTHROPIC_EU_API_KEY`, `OPENAI_API_KEY` or the Azure
# pair means the gateway builds only its two `openai_compatible` providers,
# `local` and `local_embed` - the only two `routing.yaml` declares with no
# `key_env` at all - but that is not what keeps this stub off them: the `evals`
# tenant's `confidential` rule (the default data class with no `X-Data-Class`
# header sent) already narrows every resolution to the `self` region alone,
# whatever keys are or are not configured
# (`main.py`'s own module docstring, and
# `infra/tests/infra/test_k8s_ci_kind_overlay.py`'s
# `test_the_alias_and_tenant_resolve_to_the_local_provider_only`).
#
# `evals:<sha256>` is the digest of the plaintext key
# `eval-target-stub-secrets.yaml` hands to the stub - a fixed, published,
# worthless CI constant, the same shape `tests/gateway/conftest.py`'s test keys
# already are, never a real credential.
#
# `nordlicht:<sha256>` is the same kind of throwaway key for an EU tenant, so the
# smoke check (`smoke.sh`) can prove a 451 residency refusal through the deployed
# gateway. Its plaintext is published in that script.
apiVersion: v1
kind: Secret
metadata:
  name: gateway-secrets
  namespace: apps
type: Opaque
stringData:
  OPSCONSOLE_API_KEYS: "evals:4d580b7d0bef73bbdc760e338f2e48ec013ae781661acf30e8c20f31ae6d418b,nordlicht:cae1c11d98c82b8aa7816110b492f57c7c009374fd12d4af04eeeb2c352c346c"
