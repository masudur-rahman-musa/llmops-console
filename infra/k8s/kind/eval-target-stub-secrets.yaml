# The plaintext half of the fixed CI tenant key `gateway-secrets.yaml` stores as a
# digest. Its own Secret, never a second key in `gateway-secrets`: that one is
# also the gateway's `envFrom`, and a plaintext key riding along on a Deployment
# that never reads it is the sloppy half of "credentials arrive as one of two
# whole objects" (`infra/k8s/apps/gateway.yaml`'s own comment) - `eval-target-stub`
# gets its own Secret because it is a separate reader.
apiVersion: v1
kind: Secret
metadata:
  name: eval-target-stub-secrets
  namespace: apps
type: Opaque
stringData:
  GATEWAY_API_KEY: "ci-e2e-kind-throwaway-key"
