# Option `strong-api`: the strong API tier.
#
# A PARTIAL policy, deep-merged over the shipped `routing.yaml` by
# `infra/scripts/tradeoff_policy.py`. See `cheap-api.yaml` for why every option turns the
# semantic cache off.
#
# The alias narrowed is still `agent-default`, not `agent-strong`: the table
# compares one alias resolved four ways, so the option that changes is the model
# behind it and never the name the stub asks for.
aliases:
  agent-default:
    semantic_cache: false
    candidates:
      - { provider: anthropic, model: claude-sonnet-5-5 }
