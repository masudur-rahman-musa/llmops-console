# Option `local-cpu`: llama.cpp on the ARM CPU host, no GPU.
#
# A PARTIAL policy, deep-merged over the shipped `routing.yaml` by
# `dev/scripts/tradeoff_policy.py`.
#
# No `data_class_rules` change here, and none in `gpu-vllm.yaml` either: this
# provider's region is `self`, which the shipped `confidential` rule already
# allows. Widening it would be a change this option does not need, and the
# narrower rule is the one that proves the residency path was honoured on the
# self-hosted runs.
#
# The semantic cache is off for every option.
aliases:
  agent-default:
    semantic_cache: false
    candidates:
      - { provider: local, model: qwen2.5-3b-instruct }
