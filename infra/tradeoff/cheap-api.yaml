# Option `cheap-api`: the cheap API tier.
#
# A PARTIAL policy, deep-merged over the shipped `routing.yaml` by
# `infra/scripts/tradeoff_policy.py`. Only what makes this option different is written
# here; everything else stays whatever the shipped file says, so this overlay
# cannot drift from the policy the gateway really runs.
#
# The semantic cache is off for every option. `cache_key`
# includes the resolved model, so the exact tier is safe across options, but the
# semantic tier is not keyed by model: the second option measured would read the
# first's answers and report a near-zero cost and a latency no provider served.
aliases:
  agent-default:
    semantic_cache: false
    candidates:
      - { provider: anthropic, model: claude-haiku-5-5 }
