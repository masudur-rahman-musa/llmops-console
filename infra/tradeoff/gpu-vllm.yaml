# Option `gpu-vllm`: vLLM serving Qwen2.5-7B-Instruct on one GPU host.
#
# A PARTIAL policy, deep-merged over the shipped `routing.yaml` by
# `dev/scripts/tradeoff_policy.py`.
#
# The shipped `vllm` provider is disabled and addressed at its in-cluster Service
# name, which is right for the long-lived cluster and wrong for this run: the
# measurement harness is a compose stack ON the GPU host, so the gateway's
# container reaches the model server through the node's own NodePort. The port
# is `infra/k8s/gpu/vllm.yaml`'s `vllm-node` Service, written out in both files so
# a test can compare them, and `host.docker.internal` resolves
# because `docker-compose.tradeoff.yml` gives the gateway `extra_hosts`.
#
# Enabling the provider here rather than in `routing.yaml` is the point of the
# overlay: the shipped policy keeps `vllm` disabled, so the live system never
# depends on a host that exists for four hours.
#
# The semantic cache is off for every option.
providers:
  vllm:
    enabled: true
    base_url: http://host.docker.internal:30800/v1

aliases:
  agent-default:
    semantic_cache: false
    candidates:
      - { provider: vllm, model: qwen2.5-7b-instruct }
