# Option `gpu-vllm`: vLLM serving Qwen2.5-7B-Instruct on one GPU host.
#
# A PARTIAL policy, deep-merged over the shipped `routing.yaml` by
# `infra/scripts/tradeoff_policy.py`.
#
# The `vllm` provider itself is `infra/tradeoff/providers/vllm.yaml`, which the
# builder adds to this option's provider folder. The shipped folder has no vLLM
# file, so the live system never depends on a host that exists for four hours.
#
# The semantic cache is off for every option.
aliases:
  agent-default:
    semantic_cache: false
    candidates:
      - { provider: vllm, model: qwen2.5-7b-instruct }
