# The tradeoff measurement harness: `make tradeoff-option`, never `docker compose
# up` on its own.
#
# An override over `docker-compose.yml`, under profile `tradeoff`, so the everyday
# stack never starts the stub below. One harness measures all three options (plan
# 27c decision B): the gateway is the real image, and the only thing that changes
# between options is the routing policy mounted into it.
#
# No credential is written in this file. `infra/scripts/tradeoff_run.sh` generates a
# throwaway tenant key per run and passes it, and its digest, as environment only
# - the same shape `make load` uses.
services:
  gateway:
    environment:
      # Written out rather than derived: `infra/tests/infra/test_tradeoff_run.py` checks
      # this path against the mount target below, and a drift between the two is a
      # gateway that quietly loads the shipped `routing.yaml` instead - every
      # option would then measure the same three candidates.
      OPSCONSOLE_ROUTING_POLICY_PATH: /etc/opsconsole/routing.tradeoff.yaml
      OPSCONSOLE_PROVIDERS_DIR: /etc/opsconsole/providers
      OPSCONSOLE_API_KEYS: ${OPSCONSOLE_API_KEYS}
    volumes:
      # The effective policy the run built for this option, read-only: the process
      # that is being measured cannot rewrite the definition of the measurement.
      - ${TRADEOFF_POLICY_FILE}:/etc/opsconsole/routing.tradeoff.yaml:ro
      # And its provider folder: the shipped files plus the option's own.
      - ${TRADEOFF_PROVIDERS_DIR}:/etc/opsconsole/providers:ro
    # The GPU option's provider is an SSH-forwarded NodePort on the host, so the
    # container needs a name for the host it runs on. The other two options
    # never resolve it.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  eval-target-stub:
    build: backend/evals/target-stub
    profiles: [tradeoff]
    # 8090 because the six ports `docker-compose.yml` publishes are taken, and a
    # clash is found at `up` after the GPU instance is already billing (standing
    # rule 59).
    ports: ["8090:8090"]
    environment:
      GATEWAY_BASE_URL: http://gateway:8080
      GATEWAY_API_KEY: ${GATEWAY_API_KEY}
      CASES_PATH: /cases/kind-cases.jsonl
    volumes:
      - ./backend/evals/kind-cases.jsonl:/cases/kind-cases.jsonl:ro
    depends_on:
      gateway: { condition: service_healthy }
