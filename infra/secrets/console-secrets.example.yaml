# The contract only. Copy to `console-secrets.dec.yaml`, fill every value, then
# `make secrets-encrypt`.
#
# Read by the console Deployment in `../k8s/apps/console.yaml`, by `envFrom`,
# alongside the `console-config` ConfigMap, which holds the in-cluster
# console-api URL. The console's `/readyz` stays 503 until all three below are
# set, so a missing value keeps the pod out of the Service rather than serving a
# login that cannot work.
apiVersion: v1
kind: Secret
metadata:
  name: console-secrets
  namespace: apps
type: Opaque
stringData:
  # The sha256 digest of the one shared console password, never the password.
  CONSOLE_PASSWORD_SHA256: REPLACE_ME
  # The key session cookies are signed with. At least 32 characters, or
  # `/readyz` refuses it.
  CONSOLE_SESSION_SECRET: REPLACE_ME
  # The admin key the console sends to console-api. The plaintext key: its
  # sha256 digest must be `gateway-secrets`' `OPSCONSOLE_ADMIN_KEY_SHA256`, or
  # every page reads `unauthorized`. Rotate the two together.
  CONSOLE_ADMIN_KEY: REPLACE_ME
