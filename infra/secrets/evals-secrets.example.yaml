# The contract only. Copy to `evals-secrets.dec.yaml`, fill the value, then
# `make secrets-encrypt`.
#
# Read by the nightly-eval CronJob's one container in
# `../k8s/evals/nightly-eval-cronjob.yaml`, by `envFrom` - the same variable
# `gateway-secrets` carries for the gateway Deployment, pointed at a database
# a nightly, unattended job may write `eval_runs`/`eval_cases` rows into.
apiVersion: v1
kind: Secret
metadata:
  name: evals-secrets
  namespace: evals
type: Opaque
stringData:
  OPSCONSOLE_DATABASE_URL: REPLACE_ME
