# The contract only. Copy to `gateway-secrets.dec.yaml`, fill every value, then
# `make secrets-encrypt`.
#
# Read by the gateway Deployment in `../k8s/apps/gateway.yaml`, by `envFrom`,
# alongside the `gateway-config` ConfigMap in the same file. The ConfigMap holds
# everything that is safe in git (the in-cluster Redis and Qdrant URLs, the
# environment name, the OTel service name); everything below is either a
# credential or a per-deployment endpoint that has no other home, because this
# Secret and that ConfigMap are the only two sources the container reads.
apiVersion: v1
kind: Secret
metadata:
  name: gateway-secrets
  namespace: apps
type: Opaque
stringData:
  # Postgres, as the gateway's own settings read it (`OPSCONSOLE_` prefix). The
  # user, password and database are `postgres-credentials`; this is the whole URL
  # the gateway dials, so rotating that Secret means rewriting this one too.
  OPSCONSOLE_DATABASE_URL: REPLACE_ME
  # Tenant API keys, as comma-separated `tenant:sha256hex` pairs. DIGESTS, never
  # the issued keys: the plaintext key is what a tenant is given and is stored
  # nowhere, here included. Empty authorises nobody.
  OPSCONSOLE_API_KEYS: REPLACE_ME
  # The sha256 digest of the one admin key `/admin/*` accepts. A separate key
  # space from the tenant keys above, and the only control on those routes now
  # that the public router serves `/v1` alone - an in-cluster caller still meets
  # this key.
  OPSCONSOLE_ADMIN_KEY_SHA256: REPLACE_ME
  # The key an `X-Gateway-Budget-Override` token is signed with. The secret
  # itself, not a digest: verifying an HMAC needs the key. Separate
  # from the admin key above, deliberately.
  OPSCONSOLE_BUDGET_OVERRIDE_SECRET: REPLACE_ME
  # Where traces go, and the auth that endpoint wants. Langfuse EU is an
  # OTLP/HTTP endpoint, so the endpoint is a full traces URL and the headers are
  # `key=value,key=value` carrying an `Authorization` built from the Langfuse
  # project key pair - which is the credential half, and why the endpoint sits
  # here beside it rather than in the ConfigMap.
  OPSCONSOLE_OTLP_ENDPOINT: REPLACE_ME
  OPSCONSOLE_OTLP_HEADERS: REPLACE_ME
  # The provider keys, under exactly the names the provider files in
  # `backend/config/providers/` read by `key_env`. Rename one here and the
  # provider drops out of routing silently, because an unset key is how a
  # provider is disabled.
  #
  # `OPENAI_API_KEY` (the chat fallback) and the two Azure values are OPTIONAL,
  # and no Azure provider file ships. For a provider you are not using, DELETE the line
  # from your `.dec.yaml` rather than leaving `REPLACE_ME`: unset drops the
  # provider, where a placeholder enables it with a key that cannot authenticate
  # and turns every fallback onto it into a 502.
  ANTHROPIC_API_KEY: REPLACE_ME
  OPENAI_API_KEY: REPLACE_ME
  AZURE_OPENAI_KEY: REPLACE_ME
  # `endpoint_env` for an Azure provider file: the resource root as the portal prints
  # it, with no path on it. Per-resource, so there is no default and no value of
  # it that could be committed.
  AZURE_OPENAI_ENDPOINT: REPLACE_ME
