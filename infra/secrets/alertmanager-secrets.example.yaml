# The contract only. Copy to `alertmanager-secrets.dec.yaml`, fill every value,
# then `make secrets-encrypt`.
#
# Read by the Alertmanager Deployment in `../k8s/monitoring/alertmanager.yaml`.
# The four plain values are written into its config at pod start by
# the `render-config` step, which checks each one first: a missing or bad value
# stops the pod there, with the key (never the value) in that step's log. The
# SMTP password and the bot token are never written into the config: each key
# is mounted as a file, and Alertmanager reads those two files itself. A
# rotation here takes effect on Alertmanager's next restart.
#
# Until this Secret is applied the pod waits in its start step and sends
# nothing; the deploy does not wait on it.
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-secrets
  namespace: monitoring
type: Opaque
stringData:
  # The outbound SMTP relay, host:port, port 587 (STARTTLS) or 465 (TLS); the
  # only SMTP ports `alertmanager-egress` opens. Written into the config.
  SMTP_SMARTHOST: REPLACE_ME
  # The address every alert is sent from AND to (no separate recipient key is
  # contracted here - see `alertmanager.yaml`'s comment on the receiver). An
  # email address, at most 254 characters. Written into the config.
  SMTP_FROM: REPLACE_ME
  # The SMTP login, an email address of at most 254 characters. Written into
  # the config.
  SMTP_AUTH_USERNAME: REPLACE_ME
  # Read by Alertmanager as a file, never written into the config.
  SMTP_AUTH_PASSWORD: REPLACE_ME
  # A Telegram bot's token, from @BotFather. Read as a file, never written
  # into the config.
  TELEGRAM_BOT_TOKEN: REPLACE_ME
  # The chat id the bot posts into - a person's id for a DM, or a negative
  # group id: an optional minus and 1 to 15 digits. Written into the config.
  TELEGRAM_CHAT_ID: REPLACE_ME
