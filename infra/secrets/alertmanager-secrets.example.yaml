# The contract only. Copy to `alertmanager-secrets.dec.yaml`, fill every value,
# then `make secrets-encrypt`.
#
# Read by the Alertmanager Deployment in `../k8s/monitoring/alertmanager.yaml`,
# by `envFrom`. Every value is what `alertmanager-config`'s `alertmanager.yml`
# reads back as a `${VAR}` reference (never a literal - a project rule), so a
# rotation here takes effect on Alertmanager's next restart.
#
# Until this Secret is applied the pod still starts (Alertmanager does not
# validate an env-substituted config value at load time the way it validates
# the YAML's own shape), and every notification fails at send time instead -
# silently, with nothing paging anyone about the pager itself being broken.
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-secrets
  namespace: monitoring
type: Opaque
stringData:
  # The outbound SMTP relay, host:port.
  SMTP_SMARTHOST: REPLACE_ME
  # The address every alert is sent from AND to (no separate recipient key is
  # contracted here - see `alertmanager.yaml`'s comment on the receiver).
  SMTP_FROM: REPLACE_ME
  SMTP_AUTH_USERNAME: REPLACE_ME
  SMTP_AUTH_PASSWORD: REPLACE_ME
  # A Telegram bot's token, from @BotFather.
  TELEGRAM_BOT_TOKEN: REPLACE_ME
  # The chat id the bot posts into - a person's id for a DM, or a negative
  # group id.
  TELEGRAM_CHAT_ID: REPLACE_ME
