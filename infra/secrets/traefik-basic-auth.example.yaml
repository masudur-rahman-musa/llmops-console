# The contract only. Copy to `traefik-basic-auth.dec.yaml`, fill every value,
# then `make secrets-encrypt`.
#
# ONE file, TWO documents (decision B). A Traefik `Middleware` reads its Secret
# from its OWN namespace, and `../k8s/platform/traefik-middlewares.yaml` and
# `../k8s/apps/middlewares.yaml` each declare a `basic-auth` middleware naming
# `traefik-basic-auth`, so the cluster needs one copy per routing namespace.
# Shipping them as two documents of one file is what keeps the two copies from
# drifting into different credentials for the same wall.
apiVersion: v1
kind: Secret
metadata:
  name: traefik-basic-auth
  namespace: platform
type: Opaque
stringData:
  # htpasswd lines, one per user, `<user>:<hash>`. Generate with
  #   htpasswd -nB ops
  # and paste the whole line. The hash must be bcrypt or APR1 - Traefik reads
  # the file the same way Apache does, and a plaintext password after the colon
  # authenticates nobody.
  users: ops:REPLACE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: traefik-basic-auth
  namespace: apps
type: Opaque
stringData:
  users: ops:REPLACE_ME
