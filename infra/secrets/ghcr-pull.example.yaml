# The contract only. Copy to `ghcr-pull.dec.yaml`, fill the value, then
# `make secrets-encrypt`.
#
# The image pull secret for the four Helpdesk Deployments in
# `../k8s/apps/helpdesk.yaml`, named in each pod spec's `imagePullSecrets`. The
# companion repo publishes its images as private GHCR packages; nothing else in
# the cluster pulls from there, so no other workload names this Secret.
#
# The value is a Docker config JSON built from a GitHub token with the
# `read:packages` scope and nothing else:
#
#   read -rs TOKEN                      # paste the token; kept out of shell history
#   AUTH=$(printf '%s:%s' <github-user> "$TOKEN" | base64 | tr -d '\n')
#   printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' "$AUTH"
#
# `tr -d '\n'` is not optional: GNU `base64` wraps at 76 characters, a user name
# plus a token is longer than that, and a newline inside `auth` is invalid JSON
# the API server rejects at apply.
#
# Paste that one line as the value below. `stringData` takes it as plain JSON;
# the API server base64-encodes it into `data` on apply.
#
# Rotating: issue the new token, rebuild the value, re-encrypt and apply. Pods
# already running keep their pulled image, so the next pull is the first to use
# it; revoke the old token only after one pull has succeeded.
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull
  namespace: apps
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: REPLACE_ME
