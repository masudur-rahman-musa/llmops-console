# The contract only. Copy to `grafana-admin.dec.yaml`, fill every value, then
# `make secrets-encrypt`.
#
# Read by the Grafana Deployment in `../k8s/monitoring/grafana.yaml`, by
# `envFrom`, and it is the only source that container reads: everything else
# Grafana needs is a provisioning file mounted from a ConfigMap.
#
# These two are why `grafana.example.com` is the one public host with no
# basic-auth middleware in front of it. Grafana authenticates its own callers,
# so this credential is the whole control on that host - and it is also what
# mints the service-account token CD uses to annotate releases, which a Traefik
# 401 in front of the API would have blocked.
#
# Until this Secret is applied the pod does not start. That is the intended
# direction: Grafana's built-in default is `admin:admin`, and a public host that
# comes up working on it would never mention itself again.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: monitoring
type: Opaque
stringData:
  # The admin login. Not `admin`: the default name is the half of a default
  # credential that costs nothing to change, and every scanner tries it first.
  GF_SECURITY_ADMIN_USER: REPLACE_ME
  # The admin password, in plaintext here and SOPS-encrypted in the file that is
  # actually applied. Rotating it is an edit to the encrypted copy and a
  # re-apply; Grafana reads this on every start, so a rotation takes effect on
  # the next restart rather than immediately.
  GF_SECURITY_ADMIN_PASSWORD: REPLACE_ME
