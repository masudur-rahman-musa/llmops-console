# The contract only. Copy to `backup-secrets.dec.yaml`, fill every value, then
# `make secrets-encrypt`.
#
# Read by both backup CronJobs' `rclone-sync` container in
# `../k8s/platform/backup.yaml`, by `envFrom`. Only the account-specific values
# live here (decision B): `RCLONE_CONFIG_HETZNER_TYPE` and `_PROVIDER` are not
# credentials, so they are literal `env` entries on the container instead of a
# fixed, public constant sitting behind SOPS for no reason.
apiVersion: v1
kind: Secret
metadata:
  name: backup-secrets
  namespace: platform
type: Opaque
stringData:
  # Hetzner Object Storage's S3-compatible access key pair, in the shape
  # rclone's `[hetzner]` remote reads from `RCLONE_CONFIG_HETZNER_*`.
  RCLONE_CONFIG_HETZNER_ACCESS_KEY_ID: REPLACE_ME
  RCLONE_CONFIG_HETZNER_SECRET_ACCESS_KEY: REPLACE_ME
  # The region endpoint, e.g. `https://fsn1.your-objectstorage.com`.
  RCLONE_CONFIG_HETZNER_ENDPOINT: REPLACE_ME
  # The bucket name, read by both CronJobs as the object storage path prefix.
  # Guarded with `: "${BACKUP_BUCKET:?}"` before any upload runs, so an unset
  # value fails loudly instead of writing to the bucket root.
  BACKUP_BUCKET: REPLACE_ME
