# The contract only. Copy to `helpdesk-secrets.dec.yaml`, fill every value, then
# `make secrets-encrypt`.
#
# Read by all four Helpdesk Deployments in `../k8s/apps/helpdesk.yaml`, by
# `envFrom`, alongside the `helpdesk-config` ConfigMap in the same file.
#
# The key names are the companion repo's published contract: bare, unprefixed,
# one name per value. If a name here drifts from what that repo reads, the pods
# start on their localhost defaults rather than failing loudly.
apiVersion: v1
kind: Secret
metadata:
  name: helpdesk-secrets
  namespace: apps
type: Opaque
stringData:
  # The Helpdesk's own database DSN, connecting as the restricted `helpdesk_app`
  # role the services run as, scheme `postgresql+asyncpg://`. A separate database
  # from the gateway's ledger: one Postgres, two tenants of it, and a shared
  # schema is one migration away from taking out the other repo's state. The
  # role and its database are created by hand before the first apply.
  DATABASE_URL: REPLACE_ME
  # The tenant API keys the Helpdesk presents to the gateway, one per tenant, as
  # `tenant:key,tenant:key` (for example `nordlicht:...,cuan:...`). The issued
  # KEYS, not their digests: the Helpdesk is a client here and has to send them.
  # Each key's sha256 is one of the pairs in `gateway-secrets`'
  # `OPSCONSOLE_API_KEYS`, so the two are rotated together or that tenant's
  # Helpdesk calls get a 401 on every model call.
  GATEWAY_API_KEYS: REPLACE_ME
  # The Langfuse project key pair the Helpdesk traces with, and the host it sends
  # to. The host is not a credential; it travels with the pair it belongs to.
  LANGFUSE_PUBLIC_KEY: REPLACE_ME
  LANGFUSE_SECRET_KEY: REPLACE_ME
  LANGFUSE_HOST: REPLACE_ME
  # The signing secret for the agent API's and the MCP server's session tokens.
  # At least 32 bytes of randomness, for example `openssl rand -base64 48`.
  JWT_SECRET: REPLACE_ME
