# The contract only. Copy to `helpdesk-secrets.dec.yaml`, fill every value, then
# `make secrets-encrypt`.
#
# Read by all four Helpdesk Deployments in `../k8s/apps/helpdesk.yaml`, by
# `envFrom`, alongside the `helpdesk-config` ConfigMap in the same file.
#
# These `HELPDESK_*` names are THIS repo's proposal (`../k8s/apps/helpdesk.yaml`
# decision E): the companion repo does not exist here, so its variable names
# cannot be read from it. They are published in `../k8s/README.md` as the one
# place that repo reads. If it reads different names, these pods start and
# misbehave rather than failing loudly, because a missing variable is usually a
# `None` default and not a crash.
apiVersion: v1
kind: Secret
metadata:
  name: helpdesk-secrets
  namespace: apps
type: Opaque
stringData:
  # The tenant API key the Helpdesk presents to the gateway. The issued KEY, not
  # its digest: the Helpdesk is a client here and has to send it. Its digest is
  # one of the pairs in `gateway-secrets`' `OPSCONSOLE_API_KEYS`, so the two are
  # rotated together or the Helpdesk gets a 401 on every model call.
  HELPDESK_GATEWAY_API_KEY: REPLACE_ME
  # The Helpdesk's OWN database URL. A separate database from the gateway's
  # ledger: one Postgres, two tenants of it, and a shared schema is one migration
  # away from taking out the other repo's state.
  HELPDESK_DATABASE_URL: REPLACE_ME
  # The Langfuse project key pair the Helpdesk traces with, and the host it sends
  # to. The host is not a credential; it sits here because `helpdesk-config` is
  # the only other source these pods read and this plan does not edit it.
  HELPDESK_LANGFUSE_PUBLIC_KEY: REPLACE_ME
  HELPDESK_LANGFUSE_SECRET_KEY: REPLACE_ME
  HELPDESK_LANGFUSE_HOST: REPLACE_ME
