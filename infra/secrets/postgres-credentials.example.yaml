# The contract only. Copy to `postgres-credentials.dec.yaml`, fill every value,
# then `make secrets-encrypt` - the `.dec.yaml` is gitignored and the `.enc.yaml`
# it produces is what gets committed. Never fill this file in place.
#
# Read by the Postgres StatefulSet in `../k8s/platform/postgres.yaml`, by
# `envFrom`, so every key here becomes an environment variable of that container
# under exactly this name.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: platform
type: Opaque
stringData:
  # The three the official `postgres` image reads on first start to create the
  # cluster. Changing any of them after the volume exists does nothing: the
  # initialisation runs once, so a rotation here is a new database, not a new
  # password. `infra/secrets/README.md` says how to rotate one for real.
  POSTGRES_USER: REPLACE_ME
  POSTGRES_PASSWORD: REPLACE_ME
  POSTGRES_DB: REPLACE_ME
