# Routing policy for the eval gate (`make eval`), and nothing else.
#
# A whole document, not an overlay, like `infra/load/routing.load.yaml`: no real
# provider is named in it, so a pull request's eval run cannot reach one or
# spend money whatever `.env` holds. Every provider is the mock in
# `infra/load/mock-provider/`, which answers from the help desk's golden set
#. Ids and model ids are the shipped `routing.yaml` ones, so every
# request is priced against existing `prices.yaml` rows.
#
# The help desk's two tenants, with their shipped data class rules. Budgets and
# rate limits are far above one run of the set, so the run measures the agent,
# never a limiter refusing it. No alias uses the semantic cache: two golden
# cases asking alike must each get their own answer.

providers:
  local:
    kind: openai_compatible
    region: self
    base_url: http://mock-provider:8090/v1
  local_embed:
    kind: openai_compatible
    region: self
    base_url: http://mock-provider:8090/v1

eu_regions: [eu, self]

aliases:
  agent-default:
    candidates:
      - { provider: local, model: qwen2.5-3b-instruct }
  agent-strong:
    candidates:
      - { provider: local, model: qwen2.5-3b-instruct }
  embed:
    candidates:
      - { provider: local_embed, model: bge-small-en-v1.5 }

tenants:
  nordlicht:
    residency: eu
    data_class_rules:
      public: { allow_regions: [us, eu, self] }
      internal: { allow_regions: [eu, self] }
      confidential: { allow_regions: [eu, self], redact: true }
      pii: { allow_regions: [self], redact: true }
    budget_usd_month: "1000.00"
    rate_limit: { rpm: 6000, tpm: 6000000 }
  cuan:
    residency: eu
    data_class_rules:
      public: { allow_regions: [us, eu, self] }
      internal: { allow_regions: [us, eu, self] }
      confidential: { allow_regions: [eu, self], redact: true }
      pii: { allow_regions: [self], redact: true }
    budget_usd_month: "1000.00"
    rate_limit: { rpm: 6000, tpm: 6000000 }
