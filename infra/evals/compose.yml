# The eval gate's stack: `make eval`, never `docker compose up` on its own.
#
# An override over `docker-compose.yml`, like `infra/load/compose.yml`. The
# gateway is the real image with its shipped routing policy, so the help desk's
# chat runs on the real cheap model (`agent-default`) and the judge on its own
# alias. No mock stands in for a model.
#
# No credential is written in this file. `make eval` makes a throwaway gateway
# key per run and passes its digest here as environment only. The model key
# `ANTHROPIC_API_KEY` comes from the gateway's own `backend/.env`; when the shell
# has it (CI sets it from a secret), `make eval` adds `compose.key.yml` on top.
# It is not named here: a bare name with no shell value blanks the key that
# `backend/.env` gave the gateway.
services:
  gateway:
    environment:
      OPSCONSOLE_API_KEYS: ${OPSCONSOLE_API_KEYS}
