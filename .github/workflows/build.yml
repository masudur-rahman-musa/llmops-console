name: build
# The image pipeline: the gateway and console images built for linux/amd64,
# pushed to GHCR, scanned by Trivy, and published with their SBOMs. Nothing here
# touches a cluster. A deploy workflow added on top should wait for this one to
# be green.
#
# Two jobs in one workflow rather than a workflow per image: a deploy that waits
# on this workflow's conclusion would race a second workflow, deploying a
# gateway SHA whose console image was still building.
#
# The gateway and the console only. The four `helpdesk-*`
# images belong to the companion workload repo and are published under its own
# registry path, which is why `infra/k8s/apps/kustomization.yaml` names them from
# a different owner path and this file never mentions them.
#
# No `pull_request` trigger, deliberately. A fork's pull request would arrive with
# a `GITHUB_TOKEN` and reach the login step below with `packages: write`
# requested - an untrusted `Dockerfile` running against this repository's registry.
# Pre-merge checks live in `ci.yml`, which pushes nothing.
#
# `workflow_dispatch` is here so that rebuilding an image - after a base-image CVE,
# or a runner change - is a button rather than an empty commit on `main`.
on:
  push:
    branches: [main]
    # Release tags produce an image too: without this the tag that names a release
    # points at nothing in the registry.
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  # Per ref, and NOT cancel-in-progress: an interrupted push leaves a partially
  # uploaded manifest, and the run that would have scanned it never reports. A
  # queued second build is cheaper than an unscanned image.
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    # Exactly the three the push needs, declared on the job so the scope is the
    # job's own: `contents: read` to check out, `packages: write` to push to GHCR,
    # `id-token: write` for the attestations buildx attaches to the image. No
    # `contents: write` - nothing in this pipeline writes to the repository.
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      SBOM_FILE: sbom.spdx.json
    steps:
      - uses: actions/checkout@v4

      # amd64 only: the live node is x86_64, and the emulated arm64 half
      # was most of every run. The Hetzner CAX21 path is arm64 and has to add it back.
      - uses: docker/setup-buildx-action@v3

      # The `GITHUB_TOKEN`, not a personal access token: it is scoped to this run
      # and expires with it. `registry` is required - omitted, the action logs in to
      # Docker Hub and the push goes somewhere nobody deploys from.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One tag, the full commit SHA, and nothing else. A `latest` or a `main` here
      # would be a cluster whose running code no commit names and a rollback with
      # no fixed meaning - the same reason `infra/k8s/apps/kustomization.yaml`
      # refuses a floating tag and carries `0.0.0-unbuilt` until a deploy runs.
      #
      # `sbom: true` attaches the SPDX document to the image as an attestation, so
      # the answer to "which version of that library shipped" travels with the
      # artefact rather than living in a run that ages out.
      - name: Build and push the gateway image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/masudur-rahman-musa/llmops-console/gateway:${{ github.sha }}
          sbom: true
          provenance: mode=max
          # Scoped per image: two jobs writing one unscoped cache overwrite each
          # other's layers every run.
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,scope=gateway,mode=max

      # The same attestation, read back out of the registry into a file. The
      # attestation is the record; this is so a reader can answer the question from
      # the run page without pulling the image first.
      - name: Extract the SBOM from the pushed image
        run: |
          set -euo pipefail
          docker buildx imagetools inspect \
            "ghcr.io/masudur-rahman-musa/llmops-console/gateway:${{ github.sha }}" \
            --format '{{ json .SBOM }}' > "$SBOM_FILE"

      # Uploaded BEFORE the scan, and on `always()`: a run whose Trivy step fails is
      # exactly the run someone needs the component list for, and a step with no
      # condition is skipped once an earlier one has failed.
      - name: Publish the SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: ${{ env.SBOM_FILE }}
          if-no-files-found: error

      # Trivy's own setup now downloads from get.trivy.dev, which does not
      # resolve, so every scan failed before it started. Install the same pinned
      # version straight from its GitHub release, checked against the release's
      # checksum file, and tell the scan steps to skip their own setup.
      - name: Install Trivy from its GitHub release
        env:
          TRIVY_VERSION: "0.70.0"
        run: |
          set -euo pipefail
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
          trivy --version

      # The gate. `exit-code: '1'` is the whole point: the action's default is 0,
      # which prints a CRITICAL table under a green tick. CRITICAL alone, and
      # `ignore-unfixed: true`, so the gate blocks on what a rebuild can actually
      # clear - a threshold nobody switches off in week two.
      #
      # The reference that was just pushed, not an image loaded into the runner:
      # what reached the registry is what gets scanned.
      - name: Scan the pushed image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          skip-setup-trivy: "true"
          image-ref: ghcr.io/masudur-rahman-musa/llmops-console/gateway:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: table

  # The console image, the `image` job's shape step for step. Only what differs is
  # commented; the reasons above hold here unchanged.
  console:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      SBOM_FILE: sbom.spdx.json
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Its own context: the console's `.dockerignore` applies only when the
      # context is `web`, and the root context would send the whole
      # repository to the builder.
      - name: Build and push the console image
        uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/masudur-rahman-musa/llmops-console/console:${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=console
          cache-to: type=gha,scope=console,mode=max

      - name: Extract the SBOM from the pushed image
        run: |
          set -euo pipefail
          docker buildx imagetools inspect \
            "ghcr.io/masudur-rahman-musa/llmops-console/console:${{ github.sha }}" \
            --format '{{ json .SBOM }}' > "$SBOM_FILE"

      # Named apart from the gateway's: `upload-artifact@v4` refuses a second
      # artifact of the same name in one run.
      - name: Publish the SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-console-${{ github.sha }}
          path: ${{ env.SBOM_FILE }}
          if-no-files-found: error

      # Trivy's own setup now downloads from get.trivy.dev, which does not
      # resolve, so every scan failed before it started. Install the same pinned
      # version straight from its GitHub release, checked against the release's
      # checksum file, and tell the scan steps to skip their own setup.
      - name: Install Trivy from its GitHub release
        env:
          TRIVY_VERSION: "0.70.0"
        run: |
          set -euo pipefail
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
          trivy --version

      - name: Scan the pushed image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          skip-setup-trivy: "true"
          image-ref: ghcr.io/masudur-rahman-musa/llmops-console/console:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: table
