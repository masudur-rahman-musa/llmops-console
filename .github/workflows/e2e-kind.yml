name: e2e-kind
# #68 (part, kind e2e): a full local deploy of the gateway and the real local
# llama.cpp server, exercised end to end through `ops-eval run` against ten
# golden cases.
#
# No dependency on `build.yml` or GHCR (decision D): the gateway's and the
# stub's images are BUILT and `kind load docker-image`d fresh in the runner, so
# a pull request with no push to `main` yet - and therefore no image published
# under its SHA - can still run this whole. `project-evals/ci/kind/` narrows the
# production kustomization to what a bare kind cluster can actually run; see
# that directory's own comments for why the four Helpdesk workloads, the
# console, every Ingress and two of `platform`'s files are absent.
#
# While the local model is out of use (2026-10-12) the run deploys without the
# two llama.cpp servers and checks the gateway's model-free paths with
# `project-evals/ci/kind/smoke.sh`, in place of the ten golden cases, which all
# need that model.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: e2e-kind-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the gateway image
        run: docker build -t gateway:e2e-kind backend

      - name: Build the eval-target-stub image
        run: docker build -t eval-target-stub:e2e-kind backend/evals/target-stub

      - name: Create the kind cluster
        uses: helm/kind-action@v1.15.0
        with:
          version: v0.33.0
          cluster_name: e2e-kind

      - name: Load the two locally built images into kind
        run: |
          kind load docker-image gateway:e2e-kind --name e2e-kind
          kind load docker-image eval-target-stub:e2e-kind --name e2e-kind

      # `kubectl apply -k` has no `--load-restrictor` flag of its own (only
      # `kubectl kustomize` does), so the relaxed build is piped in rather than
      # built inline - `project-evals/ci/kind/kustomization.yaml`'s own comment
      # says why this overlay needs it at all.
      - name: Apply the CI-only kind kustomization
        run: |
          kubectl kustomize --load-restrictor=LoadRestrictionsNone project-evals/ci/kind \
            | kubectl apply -f -

      - name: Wait for the gateway and the stub target to roll out
        run: |
          kubectl -n apps rollout status deployment/gateway --timeout=5m
          kubectl -n apps rollout status deployment/eval-target-stub --timeout=5m

      # While the local model is out of use, the golden set (`ops-eval run`
      # through the stub on 8090) cannot run: every case needs that model. The
      # run checks the gateway's model-free paths instead, through a port-forward
      # to the gateway itself - still never a NodePort or a public address.
      # When the local model returns, restore the stub port-forward, `uv sync`
      # and the `ops-eval run --set backend/evals/golden/e2e-kind.jsonl` step.
      - name: Port-forward the gateway
        run: |
          kubectl -n apps port-forward svc/gateway 18080:8080 &
          sleep 3

      - name: Check the deployed gateway without a model
        run: project-evals/ci/kind/smoke.sh http://127.0.0.1:18080

      # `always()`, the same reason `eval-gate.yml`'s upload is: a FAILED run -
      # a cluster-up failure, a rollout timeout, or a failed case - is exactly
      # when the report is needed, and a step with no `if` is skipped once an
      # earlier step fails.
      - name: Publish the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-kind-report-${{ github.run_id }}
          path: reports/

      # Last, so it runs after ANY failed step (a timed-out rollout or a failed
      # case alike) while the cluster still exists. A rollout says only "0 of 1
      # available" and a case only "server disconnected"; this prints why: node
      # CPU, pod state, events, and each pod's logs, including the run before a
      # restart.
      - name: Show the cluster state on failure
        if: failure()
        run: |
          echo "runner CPUs: $(nproc)"
          kubectl describe nodes | sed -n '/Allocatable/,/System Info/p;/Allocated resources/,/Events/p' || true
          for ns in apps platform; do
            kubectl -n "$ns" get pods -o wide || true
            kubectl -n "$ns" get events --sort-by=.lastTimestamp | tail -40 || true
            kubectl -n "$ns" describe pods | tail -120 || true
            for pod in $(kubectl -n "$ns" get pods -o name); do
              echo "--- logs $ns/$pod"
              kubectl -n "$ns" logs "$pod" --all-containers --tail=60 || true
              kubectl -n "$ns" logs "$pod" --all-containers --previous --tail=60 2>/dev/null || true
            done
          done
