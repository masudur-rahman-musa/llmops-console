name: ci
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are worth cancelling; a main commit's gate is not, or it
  # ends up recorded as neither passed nor failed.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    # The Redis the map-store suite needs. It is a service container rather than
    # an optional local server so that the skip in
    # `tests/redaction/test_redis_store.py` cannot silently be taken in CI: those
    # cases prove the TTL and the key shape against Redis itself, and a suite
    # that skipped them here would report green having checked neither.
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # `OPSCONSOLE_TEST_REDIS_URL`, not `OPSCONSOLE_REDIS_URL`: the second is
      # read by `Settings` itself, so exporting it for the whole job would give
      # every test that builds an app a Redis map store and a `redis` readiness
      # probe it never asked for - a suite that behaved one way locally and
      # another in CI. Database 15, away from the 0 an application would use.
      OPSCONSOLE_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      # `make lint`, `typecheck` and `test` also run the console's scripts now
      # that services/console exists, so this job needs pnpm and its install too.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: services/console/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: services/console/pnpm-lock.yaml
      - run: pnpm -C services/console install --frozen-lockfile
      # Same checks as the local pre-commit hooks, and unskippable here.
      - run: uv run pre-commit run --all-files
      # Mirrors the Makefile gate. `format` runs as a check with the locked ruff,
      # not only through the pre-commit-pinned one.
      - run: uv run ruff format --check .
      - run: make lint
      - run: make typecheck
      - run: make test

  # The console on its own: a red here names the console, not the Python gate.
  # `pnpm audit` lives only in this job, so a new advisory fails one clearly
  # labelled check.
  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/console
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: services/console/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: services/console/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit

  # Terraform's own checks on the Hetzner module. `fmt`, `init` and `validate`
  # are unconditional: they need no credential, and they are the only semantic
  # check the module gets - the pytest file beside them pins text, not meaning.
  # `plan` needs a real Terraform Cloud token, which a fork pull request does
  # not have, so it is skipped when the token is absent and the skip is echoed
  # into the log rather than left as a green tick nobody can interpret.
  tf:
    runs-on: ubuntu-latest
    env:
      # The `secrets` context is not readable from an `if:`, so the presence
      # check is lifted here, where it is, and the conditions below read the
      # answer rather than the token.
      TF_API_TOKEN_PRESENT: ${{ secrets.TF_API_TOKEN != '' }}
    defaults:
      run:
        working-directory: infra/terraform/hetzner
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      # One init, always run, choosing its backend from what it has. With the
      # token it initialises Terraform Cloud so the plan step can run; without
      # it, `-backend=false` gives `validate` everything it needs and says so.
      # Keeping this one step is what keeps `validate` unconditional.
      - name: terraform init
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
        run: |
          if [ -n "$TF_TOKEN_app_terraform_io" ]; then
            terraform init -input=false
          else
            terraform init -backend=false -input=false
            echo "note: no TF_API_TOKEN, initialised without the Terraform Cloud backend"
          fi
      - run: terraform validate
      - name: terraform plan
        if: env.TF_API_TOKEN_PRESENT == 'true'
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
        run: terraform plan -input=false -lock=false
      - name: no credentials, no plan
        if: env.TF_API_TOKEN_PRESENT == 'false'
        run: |
          echo "skip: TF_API_TOKEN is unset, so terraform plan did not run; fmt and validate did"

  # The same three unconditional checks on the AWS module, in a job of its own:
  # its plan needs AWS credentials the Hetzner job must never hold, so the two
  # differ in permissions as well as directory. The plan assumes a read-only
  # role through GitHub OIDC, so no long-lived AWS key exists anywhere. It runs
  # only when BOTH the Terraform Cloud token and the role ARN are set; until the
  # owner creates that role (infra/terraform/aws/README.md) it skips out loud.
  tf-aws:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      TF_API_TOKEN_PRESENT: ${{ secrets.TF_API_TOKEN != '' }}
    defaults:
      run:
        working-directory: infra/terraform/aws
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      # One init, always run, choosing its backend from what it has, exactly as
      # the `tf` job does: keeping it one step keeps `validate` unconditional.
      - name: terraform init
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
        run: |
          if [ -n "$TF_TOKEN_app_terraform_io" ]; then
            terraform init -input=false
          else
            terraform init -backend=false -input=false
            echo "note: no TF_API_TOKEN, initialised without the Terraform Cloud backend"
          fi
      - run: terraform validate
      - name: assume the read-only plan role
        if: env.TF_API_TOKEN_PRESENT == 'true' && vars.AWS_PLAN_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: eu-central-1
      # The workspace runs in local execution mode, so its variables are not
      # read; the two required inputs are documentation-range placeholders. A
      # plan proves the configuration against the real API and is never applied.
      - name: terraform plan
        if: env.TF_API_TOKEN_PRESENT == 'true' && vars.AWS_PLAN_ROLE_ARN != ''
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_VAR_admin_ips: '["203.0.113.7/32"]'
          TF_VAR_budget_email: you@example.com
        run: terraform plan -input=false -lock=false
      - name: no credentials, no plan
        if: env.TF_API_TOKEN_PRESENT != 'true' || vars.AWS_PLAN_ROLE_ARN == ''
        run: |
          echo "skip: TF_API_TOKEN or vars.AWS_PLAN_ROLE_ARN is unset, so terraform plan did not run; fmt and validate did"

  # The GPU measurement module, the same shape as `tf-aws`: one instance, never
  # applied by CI. A third input, the SSH key, must carry the `ssh-ed25519 `
  # prefix its validation requires, so the placeholder is a well-formed dummy.
  tf-aws-gpu:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      TF_API_TOKEN_PRESENT: ${{ secrets.TF_API_TOKEN != '' }}
    defaults:
      run:
        working-directory: infra/terraform/aws-gpu
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - name: terraform init
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
        run: |
          if [ -n "$TF_TOKEN_app_terraform_io" ]; then
            terraform init -input=false
          else
            terraform init -backend=false -input=false
            echo "note: no TF_API_TOKEN, initialised without the Terraform Cloud backend"
          fi
      - run: terraform validate
      - name: assume the read-only plan role
        if: env.TF_API_TOKEN_PRESENT == 'true' && vars.AWS_PLAN_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: eu-central-1
      - name: terraform plan
        if: env.TF_API_TOKEN_PRESENT == 'true' && vars.AWS_PLAN_ROLE_ARN != ''
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_VAR_admin_ips: '["203.0.113.7/32"]'
          TF_VAR_budget_email: you@example.com
          TF_VAR_ssh_public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPlaceholderKeyForPlanOnly you@example.com
        run: terraform plan -input=false -lock=false
      - name: no credentials, no plan
        if: env.TF_API_TOKEN_PRESENT != 'true' || vars.AWS_PLAN_ROLE_ARN == ''
        run: |
          echo "skip: TF_API_TOKEN or vars.AWS_PLAN_ROLE_ARN is unset, so terraform plan did not run; fmt and validate did"

  # kustomize and kubeconform need no credential of any kind, so unlike the `tf`
  # job's plan step nothing here is gated: this runs whole on a fork pull
  # request, which is where a manifest first arrives from someone who cannot
  # run the cluster. Separate from `tf` because that job pins itself to the
  # terraform module's directory and installs a toolchain this one has no use
  # for; running `make infra-check` here would drag the whole terraform gate in
  # and report its failures as kustomize ones.
  k8s:
    runs-on: ubuntu-latest
    env:
      # Pinned rather than tracking latest: an unpinned kustomize changes what
      # the build emits and an unpinned kubeconform changes what it accepts, and
      # either would move this gate underneath a diff that did not touch it.
      # KUSTOMIZE_VERSION matches the kustomize embedded in the kubectl the
      # tests build with locally, so CI and a developer see one output.
      KUSTOMIZE_VERSION: 5.5.0
      KUBECONFORM_VERSION: 0.6.7
    steps:
      - uses: actions/checkout@v4
      - name: install kustomize and kubeconform
        run: |
          curl -sSfL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | tar -xz -C /usr/local/bin kustomize
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar -xz -C /usr/local/bin kubeconform
          kustomize version && kubeconform -v
      # The same target the Makefile gives a developer, so the two cannot drift.
      - run: make k8s-check
      # The AWS evidence overlay, built and validated the same way. It is only ever
      # applied from the owner's shell, so this is its one automated check.
      - run: make k8s-aws-check
      # The GPU measurement build. Standalone, applied only from the owner's shell
      # to a short-lived GPU host, so this is its one automated check too.
      - run: make k8s-gpu-check

  # The secret scan CI did not have. The gitleaks pre-commit hook scans a STAGING
  # AREA, and the `check` job runs the hooks through `pre-commit run --all-files`
  # where nothing is staged - so the hook's own gate is silently a no-op here.
  # This job scans every commit instead, which is the half a staged scan can never
  # do: a key removed in a later commit still sits in the history that gets cloned.
  # The known findings are 14 fake literals in test files, allowed one exact
  # fingerprint at a time in `.gitleaksignore`.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history. A default checkout gives the runner one commit, and
          # a history scan over one commit is a green tick that proves nothing.
          fetch-depth: 0
      # 8.24.3 is written out four times on purpose, and NOT lifted into an `env:`
      # var: `tests/ci/test_ci_workflow.py` compares this number against the
      # `rev: v8.24.3` in `.pre-commit-config.yaml`, and that drift is only visible
      # to a static reader if this file SAYS the number. The two
      # scanners must agree on what counts as a secret.
      - name: install gitleaks
        run: |
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_8.24.3_checksums.txt"
          tar -xzf "gitleaks_8.24.3_linux_x64.tar.gz" gitleaks
      # `--ignore-missing` above because the release publishes one checksums file
      # covering all twelve platform archives and the runner downloaded one of them.
      # The scan carries no staging-area flag: those are the local hook's, and they
      # would narrow this to an index a runner never has.
      - name: scan every commit
        run: ./gitleaks git --redact --exit-code 1 .

  # The Python dependency audit. `pnpm audit` already covers the console in its own
  # job and Trivy covers the images in `build.yml`; the locked Python set had
  # nothing reading it. pip-audit runs through `uvx` rather than joining the `dev`
  # group: the tool is CI's, not the package's, so the lockfile stays untouched.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # `--locked` so this audits what the repository actually pins rather than a
      # fresh resolve, `--all-groups` so the dev and test trees are audited too, and
      # `--no-emit-project` to keep the unhashed editable entry out of a file that
      # is about to be read under `--require-hashes`.
      - name: export the locked dependency set
        run: uv export --format requirements-txt --locked --no-emit-project --all-groups -o requirements-audit.txt
      # `--strict` so an unresolvable dependency fails rather than warning, and
      # `--disable-pip` so the audit resolves nothing of its own.
      - name: audit the locked dependency set
        run: uvx --from pip-audit==2.9.0 pip-audit --strict --require-hashes --disable-pip -r requirements-audit.txt
