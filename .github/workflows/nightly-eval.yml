name: nightly-eval
# The one nightly eval path. The in-cluster CronJob is gone: its cases
# would have been a copy of the help desk's file baked into an image. This workflow
# checks out the help desk repository and plays its 45 conversation cases against
# the target below, with the real models, and pushes the scores to the Pushgateway.
#
# Gated on the `EVAL_TARGET_URL` repository variable: there is no standing target to
# run this against yet, so the job is wired but skipped until that variable is set.
# See the project notes.
on:
  # Manual only: evals run on demand, not on a timer. Run it from the Actions tab
  # or `gh workflow run nightly-eval.yml`. Switch on a `schedule:` here once the
  # target exists and the cost is accepted.
  workflow_dispatch:

concurrency:
  group: nightly-eval
  cancel-in-progress: false

jobs:
  nightly-eval:
    if: vars.EVAL_TARGET_URL != ''
    runs-on: ubuntu-latest
    env:
      # The judge's gateway key. With it unset, the run scores the three checks
      # only and says so.
      OPSCONSOLE_EVAL_JUDGE_KEY: ${{ secrets.OPSCONSOLE_EVAL_JUDGE_KEY }}
    steps:
      - uses: actions/checkout@v4
      # The help desk repo is private, so it is checked out with a read-only token
      # beside this one, to read its cases.
      - uses: actions/checkout@v4
        with:
          repository: masudur-rahman-musa/ai-help-desk-governed-access
          token: ${{ secrets.HELPDESK_REPO_TOKEN }}
          path: helpdesk
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --project backend
      # The judge is on only when `NIGHTLY_JUDGE_URL` (a gateway address) is set.
      - name: Play the help desk's conversations against the nightly target
        env:
          JUDGE_URL: ${{ vars.NIGHTLY_JUDGE_URL }}
        run: |
          uv run --project backend ops-eval conversations \
            --target "${{ vars.EVAL_TARGET_URL }}" \
            --cases helpdesk/backend/evals/conversations/cases.jsonl \
            --run-kind nightly \
            --out reports \
            ${JUDGE_URL:+--judge-url "$JUDGE_URL"} \
            --pushgateway-url "${{ vars.NIGHTLY_PUSHGATEWAY_URL }}"
      - name: Publish the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-eval-report-${{ github.run_id }}
          path: reports/
