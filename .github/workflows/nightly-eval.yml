name: nightly-eval
# SPEC line 344's documented backup path to the k3s CronJob (`infra/k8s/evals/
# nightly-eval-cronjob.yaml`, REQUIREMENTS #43): if the cluster's own nightly job is
# ever missed or the cluster is down, this workflow can run the same golden set on
# the same schedule from a clean checkout.
#
# Gated exactly the way `eval-gate.yml`'s `eval` job is (decision A there): there is
# no `EVAL_TARGET_URL` repository variable yet - no target exists to run this
# against - so the job is wired but SKIPPED until that variable is set. See
# the project notes.
on:
  # Manual only: evals run on demand, not on a timer. Run it from the Actions tab
  # or `gh workflow run nightly-eval.yml`.
  workflow_dispatch:

concurrency:
  group: nightly-eval
  cancel-in-progress: false

jobs:
  nightly-eval:
    if: vars.EVAL_TARGET_URL != ''
    runs-on: ubuntu-latest
    env:
      OPSCONSOLE_EVAL_JUDGE_KEY: ${{ secrets.OPSCONSOLE_EVAL_JUDGE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --project backend
      - name: Run the golden set against the nightly target
        run: |
          uv run --project backend ops-eval run \
            --target "${{ vars.EVAL_TARGET_URL }}" \
            --set backend/evals/golden/example.jsonl \
            --tenant evals \
            --run-kind nightly \
            --out reports \
            --pushgateway-url "${{ vars.NIGHTLY_PUSHGATEWAY_URL }}"
      - name: Publish the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-eval-report-${{ github.run_id }}
          path: reports/
