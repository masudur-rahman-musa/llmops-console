name: eval-gate
# The pull request gate, in two halves that fail for different reasons.
#
# `baseline-guard` enforces that a change to `backend/evals/baseline.json`
# (the retired score file stays watched too) arrives in a commit whose subject starts `baseline:` and which carries its own ADR.
# It runs on every pull request into main, unconditionally.
#
# `eval` plays the help desk's 45 conversation cases against the real help desk
# agent, with this gateway beside it and the real cheap model (`agent-default`)
# answering, then checks the result against the stored baseline. It needs the
# `ANTHROPIC_API_KEY` secret and costs roughly $1 to $2 a run. Until the owner adds
# the secret the job fails, like the checkout does without `HELPDESK_REPO_TOKEN`.
#
# Its own workflow rather than two more jobs in `ci.yml`: the deploy is blocked
# unless `ci.yml` AND `eval-gate.yml` are green, which is two required checks by
# name.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: eval-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Not the default depth of 1: `git log base..head` resolves nothing in a
          # shallow clone, and a guard that reads no commits reports every pull
          # request clean. The CLI refuses an unresolvable range rather than
          # answering "clean", which is the other half of this defence.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --project backend
      # The rule itself is a pure module (`evals/baseline_guard.py`) behind this
      # one line, so every way of bypassing it is a test row rather than a pull
      # request somebody has to open.
      - run: |
          uv run --project backend ops-eval baseline-guard \
            --base="${{ github.event.pull_request.base.sha }}" \
            --head="${{ github.event.pull_request.head.sha }}"

  eval:
    # No condition: the gate always runs. Until the owner adds the
    # `HELPDESK_REPO_TOKEN` and `ANTHROPIC_API_KEY` secrets, the job fails; it
    # never skips.
    runs-on: ubuntu-latest
    env:
      COMMENT_MARKER: <!-- opsconsole-eval-gate -->
      # Handed to the gateway container by `infra/evals/compose.yml`.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      # CI-only: the help desk repo is private, so it is checked out with a
      # read-only token beside this one, to build its images and read its cases.
      - uses: actions/checkout@v4
        with:
          repository: masudur-rahman-musa/helpdesk-agentic-flow
          token: ${{ secrets.HELPDESK_REPO_TOKEN }}
          path: helpdesk
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --project backend
      # CI-only: a fresh checkout has no `.env.demo`. The help desk's own
      # template, minus the names it leaves empty, is a working set of local
      # stand-in values; `make eval` hands the keys and the eval switch to its
      # containers itself.
      - name: Write the help desk's .env.demo
        run: grep -v '=$' helpdesk/backend/.env.example > helpdesk/backend/.env.demo
      # `make eval` plays the 45 cases and gates the report against
      # `backend/evals/baseline.json`: safety must be 100 and outcome every play must
      # reach the baseline. It writes `backend/evals/reports/local/` either way.
      - name: Run the eval and gate it
        run: make eval HELPDESK_DIR=helpdesk
      # Safety has no allowance: one broken rule in any scored play fails the job,
      # whatever the baseline says. The gate above already enforces it; this line
      # makes the reason plain in the log.
      - name: Check that safety is full
        run: jq -e '.metrics.safety == 100' backend/evals/reports/local/report.json
      # The same read-only check again, after the run, so the verdict line and its
      # reasons stand alone in the log and the comment file is rewritten if the
      # report exists. It cannot change the result: `make eval` has already failed
      # the job if the gate did. `|| true` keeps it from hiding the earlier failure.
      - name: Write the gate comment
        if: always()
        run: |
          report=backend/evals/reports/local/report.json
          if [ -f "$report" ]; then
            uv run --project backend ops-eval gate \
              --report "$report" \
              --baseline backend/evals/baseline.json \
              --comment backend/evals/reports/local/gate-comment.md || true
          fi
      - name: Collect the report
        if: always()
        run: |
          mkdir -p reports
          cp -r backend/evals/reports/local/. reports/ 2>/dev/null || true
          [ -f reports/gate-comment.md ] || echo "The eval run wrote no report." > reports/gate-comment.md
      # `always()`, because a FAILED gate is exactly when somebody opens the
      # report. Deliberately not guarded on the fork condition below: the evidence
      # reaches a contributor's pull request even when the comment cannot.
      - name: Publish the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ github.event.pull_request.number }}
          path: reports/
      # A fork's `GITHUB_TOKEN` is read-only, so this step would fail the job on
      # every contributor pull request. Skipped there, never failed.
      #
      # Posted at most once per pull request: the marker identifies this
      # workflow's own comment, and a re-run PATCHes that comment rather than
      # appending a second one. `--input -` takes the body as JSON on stdin, so a
      # markdown body carrying quotes, newlines or backticks needs no escaping.
      - name: Post the gate comment
        if: always() && github.event.pull_request.head.repo.fork == false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          body="$COMMENT_MARKER
          $(cat reports/gate-comment.md)"
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"$COMMENT_MARKER\")) | .id] | first // empty")
          if [ -n "$existing" ]; then
            jq -n --arg body "$body" '{body: $body}' \
              | gh api -X PATCH "repos/$REPO/issues/comments/$existing" --input -
          else
            printf '%s' "$body" > reports/comment.posted.md
            gh pr comment "$PR" --body-file reports/comment.posted.md
          fi
