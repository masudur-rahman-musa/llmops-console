name: load
# k6 load: the gateway at 50 RPS for ten minutes over the
# fixed-delay mock provider, run by hand. Never on a pull request or a push: ten
# minutes of a shared runner's noisy CPU per change buys no signal a local run
# does not already give.
#
# `make load` is the whole run, so this workflow and a laptop run the exact same
# compose command. The tenant key is generated inside it for this run only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run the load test
        run: make load

      # `always()`: a breached threshold fails the step above, and that run's
      # summary is the one most worth reading.
      - name: Publish the k6 summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-summary-${{ github.run_id }}
          path: infra/load/results/
