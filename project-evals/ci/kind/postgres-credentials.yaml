# The throwaway cluster's Postgres credentials. `infra/k8s/platform/postgres.yaml`
# reads them by `envFrom` and the kind run never supplied them, so postgres-0 sat
# in CreateContainerConfigError. Fixed placeholder values: the cluster lives for
# one CI run, is reachable only through a port-forward, and holds no real data.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: platform
type: Opaque
stringData:
  POSTGRES_USER: opsconsole
  POSTGRES_PASSWORD: kind-ci-only
  POSTGRES_DB: opsconsole
