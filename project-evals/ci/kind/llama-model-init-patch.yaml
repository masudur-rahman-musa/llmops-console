# A strategic merge patch adding ONE initContainer to `infra/k8s/apps/llama.yaml`'s
# Deployment, CI-only. `infra/k8s/README.md` documents the deliberate repo-wide
# rule this would otherwise break: "no container downloads" a GGUF, because "an
# unverified download URL with a checksum nobody has ever compared anything to is
# worse than an absence that says so." This satisfies that bar instead of
# bypassing it: the URL and the sha256 below are both pinned constants
# (`test_the_model_fetch_step_verifies_a_checksum` in
# `tests/infra/test_k8s_ci_kind_overlay.py`), read from the same upstream
# `Qwen/Qwen2.5-3B-Instruct-GGUF` repository `infra/k8s/README.md` already names
# for the human step, resolved to its published git-LFS `oid sha256` at
# implementation time - the same kind of resolution 20d's own comment describes
# for `llama`'s image tag.
#
# `python:3.12-slim`, not a curl image: this repo already pins that exact base for
# the gateway's own Dockerfile, and hashing in Python needs no assumption about
# which checksum tool a minimal image does or does not ship with.
#
# The corruption-on-mismatch behaviour (`dest.unlink()` before the `SystemExit`)
# is what stops a half-downloaded or tampered file surviving a pod restart into a
# stale PASS: `initContainers` re-run on every restart, so a left-over file that
# happened to verify once would never be re-checked.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama
  namespace: apps
spec:
  template:
    spec:
      initContainers:
        - name: fetch-model
          image: python:3.12-slim
          command: ["python3", "-c"]
          args:
            - |
              import hashlib
              import pathlib
              import urllib.request

              url = "https://huggingface.co/Qwen/Qwen2.5-3B-Instruct-GGUF/resolve/main/qwen2.5-3b-instruct-q4_k_m.gguf"
              dest = pathlib.Path("/models/qwen2.5-3b-instruct-q4_k_m.gguf")
              expected = "626b4a6678b86442240e33df819e00132d3ba7dddfe1cdc4fbb18e0a9615c62d"

              urllib.request.urlretrieve(url, dest)

              digest = hashlib.sha256()
              with dest.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              actual = digest.hexdigest()
              if actual != expected:
                  dest.unlink()
                  raise SystemExit(
                      f"qwen2.5-3b-instruct-q4_k_m.gguf: sha256 {actual} != {expected}"
                  )
          volumeMounts:
            - name: models
              mountPath: /models
