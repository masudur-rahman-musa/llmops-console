[project]
name = "ai-operations-console"
version = "0.1.0"
description = "LLM gateway with routing, residency enforcement, redaction, caching, budgets and evals"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    # Runtime, not dev: the provider adapters call out over it. The test suite
    # uses its MockTransport, so the dev group needs no entry of its own.
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "types-PyYAML>=6.0",
    # Pinned exactly, and to the same version as the ruff pre-commit hook: CI's
    # formatting verdict comes from the hook, so a drift between the two is a
    # CI failure with no local command that reproduces it.
    "ruff==0.16.6",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `opsconsole` is nested one level deep, `services` is not; map the former's
# parent onto the root so both import under their own names.
only-include = ["packages/opsconsole/opsconsole", "services"]

[tool.hatch.build.targets.wheel.sources]
"packages/opsconsole" = ""

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
# Without this, `exclude` is advisory for a path named on the command line, and
# the PostToolUse formatter hook always names one explicit path.
force-exclude = true

[tool.ruff.lint]
# `W` is here for W605 specifically: a docstring citing a regex or a `grep -E`
# is a habit in this repo, and `\(` in a non-raw docstring passes both mypy and
# every other rule while emitting a SyntaxWarning nothing reads - and it becomes
# a SyntaxError in a later Python.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Agent hooks keep long rule strings on one line so the pattern stays readable.
# Everything else (F, B, ...) still applies to them.
".claude/**" = ["E501"]

[tool.ruff.lint.isort]
# The package lives at packages/opsconsole/opsconsole/, so ruff cannot infer
# first-party from the layout. Without this, first-party imports group with
# third-party ones and every file that gets it right fails I001.
known-first-party = ["opsconsole", "services"]

[tool.ruff.format]
# `.claude/` is agent tooling checked in as-is; linting it is useful, reflowing
# it is a diff outside every plan's file list.
exclude = [".claude/**"]

[tool.mypy]
files = ["packages", "services", "tests"]
python_version = "3.12"
strict = true
mypy_path = "packages/opsconsole"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["packages/opsconsole/opsconsole", "services/gateway"]
# Statement coverage would call a guard 100% covered with one side of every
# `if` never taken, which is exactly what the 100% packages exist to rule out.
branch = true

[tool.coverage.report]
show_missing = true
