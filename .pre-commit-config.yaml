repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
        # Kubernetes manifests hold several documents per file, split by `---`.
        args: [--allow-multiple-documents]
      - id: check-toml
      # Recorded fixtures are byte-exact: an SSE stream's last event ends in a
      # blank line, and a JSONL set may carry one on purpose.
      - id: end-of-file-fixer
        exclude: ^tests/.*/fixtures/
      - id: trailing-whitespace
        exclude: ^tests/.*/fixtures/
      - id: detect-private-key
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
