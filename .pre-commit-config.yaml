repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
        # Kubernetes manifests hold several documents per file, split by `---`.
        args: [--allow-multiple-documents]
      - id: check-toml
      # Recorded fixtures are byte-exact: an SSE stream's last event ends in a
      # blank line, and a JSONL set may carry one on purpose.
      - id: end-of-file-fixer
        exclude: ^(backend|infra)/tests/.*/fixtures/
      - id: trailing-whitespace
        exclude: ^(backend|infra)/tests/.*/fixtures/
      - id: detect-private-key
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      # The ruff settings live in backend/pyproject.toml. Naming it with --config
      # applies them to every Python file, and its paths resolve from the root.
      - id: ruff-check
        args: [--fix, --config, backend/pyproject.toml]
      - id: ruff-format
        args: [--config, backend/pyproject.toml]
  - repo: local
    hooks:
      # Keeps the repo root to the names in .github/root-allowlist. The same
      # check runs in CI (ci.yml).
      - id: check-root
        name: check repo root against the allowlist
        entry: python3 .github/scripts/check_root.py
        language: system
        pass_filenames: false
        always_run: true
