# One command brings up the whole local stack: `docker compose up -d`.
#
# No secret is written here. Every credential the gateway needs arrives through
# `env_file: backend/.env`, and the values below that look like
# credentials are the LOCAL Postgres account, which exists only inside this
# compose network and is created by the same variables that connect to it.
#
# The backing services publish SHIFTED host ports - Postgres on 15432, Redis on
# 16379, Qdrant on 16333, llama.cpp on 18082 - while the container side keeps the
# stock number every client in here dials by service name. The companion Helpdesk
# repository's own stack publishes 5432, 6379, 6333 and 8082, and the two are meant
# to run side by side: this stack is the gateway the Helpdesk calls, so a clash at
# `up` would mean only ever having one of them. The gateway stays on 8080 because
# that is the address the Helpdesk's `GATEWAY_URL` names.
#
# Anything on the host that dials these directly - `psql`, `redis-cli`, a gateway
# run outside compose - uses the shifted port, which is what `.env.example`'s
# `localhost` URLs carry.
#
# Every backing service declares a healthcheck, so `docker compose up -d --wait`
# and the gateway's `depends_on` block until the service can actually answer -
# a container that is running is not a service that is ready, which is the same
# distinction `/healthz` and `/readyz` draw inside the process.
services:
  gateway:
    build: backend
    # `backend/.env.demo` (stand-in values) first, then the owner's real
    # `backend/.env` over it. Both optional, so `docker compose config` and a
    # stack brought up for the backing services alone work on a fresh checkout
    # (pinned by `infra/tests/infra/test_root_cleanup.py`). A gateway that needs
    # to reach a provider still needs `backend/.env`: `backend/.env.example` is
    # the template, and no credential is written in this file.
    env_file:
      - path: backend/.env.demo
        required: false
      - path: backend/.env
        required: false
    ports: ["8080:8080"]
    environment:
      # The service names on this network, not localhost: these override
      # whatever `.env` carries for a developer running the gateway outside
      # compose. They are what `/readyz` then probes.
      OPSCONSOLE_REDIS_URL: redis://redis:6379/0
      OPSCONSOLE_DATABASE_URL: postgresql://opsconsole:${POSTGRES_PASSWORD:-opsconsole}@postgres:5432/opsconsole
      OPSCONSOLE_QDRANT_URL: http://qdrant:6333
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      qdrant: { condition: service_healthy }

  # The console web app on port 3001, behind the `app` profile like the Helpdesk's
  # containers, so a plain `docker compose up -d` stays the backing services and
  # the gateway. `make up` turns the profile on. It reads `web/.env.local` for
  # its login values, and reaches the gateway by service name, not localhost.
  console:
    profiles: ["app"]
    build: web
    env_file:
      - path: web/.env.local
        required: false
    environment:
      CONSOLE_API_URL: http://gateway:8080
    ports: ["3001:3001"]
    depends_on:
      gateway: { condition: service_started }

  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["16379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    # No persistence on purpose: everything Redis holds here is a redaction map
    # with an hour's TTL and, from an earlier change, a cache entry. Both are derived data,
    # and a disk image of them is personal data at rest that nothing needs.

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: opsconsole
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opsconsole}
      POSTGRES_DB: opsconsole
    ports: ["15432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsconsole -d opsconsole"]
      interval: 5s
      timeout: 3s
      retries: 10

  pushgateway:
    # Local target for `ops-eval run --pushgateway-url`, matching
    # `infra/k8s/evals/pushgateway.yaml`'s pinned version. No healthcheck and no
    # `depends_on` anywhere: this image is a scratch binary with no shell, and
    # nothing in this compose file's own startup path needs it up first - it is
    # a manual convenience for exercising `--pushgateway-url` against something
    # real, not a dependency any other service waits on.
    image: prom/pushgateway:v1.11.3
    ports: ["9091:9091"]

  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports: ["16333:6333"]
    volumes: ["qdrantdata:/qdrant/storage"]
    healthcheck:
      # Qdrant's image carries no curl and no wget, so the check is its own
      # binary answering the same readiness path the gateway probe reads.
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 5s
      timeout: 3s
      retries: 10

  llama:
    # The `local` provider in routing.yaml, which is the only region an EU
    # tenant's `pii` traffic may reach. The model is a mount rather than a build
    # argument: no weights are committed, and MODELS_DIR points at wherever the
    # developer keeps them.
    # Pinned to the same build `infra/k8s/apps/kustomization.yaml` pins, so a
    # developer and the cluster run the same server. `server` floats.
    # Off by default, as on the node: `docker compose --profile
    # local-model up -d`, or `COMPOSE_PROFILES=local-model` in `.env`, brings
    # both llama services back. Pinned by infra/tests/infra/test_compose_local_model.py.
    profiles: [local-model]
    image: ghcr.io/ggml-org/llama.cpp:server-b10902
    command: ["-m", "/models/${LLAMA_MODEL_FILE:-qwen2.5-3b-instruct-q4_k_m.gguf}", "--host", "0.0.0.0", "--port", "8082", "--ctx-size", "8192"]
    ports: ["18082:8082"]
    volumes: ["${MODELS_DIR:-./.cache/models}:/models:ro"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      # A first load of the model off a cold disk is minutes, not seconds.
      retries: 60
      start_period: 60s

  llama-embed:
    # The `local_embed` provider in routing.yaml: one llama.cpp process serves
    # one model, so `/v1/embeddings` and the semantic cache probe need a second
    # server at a second address. Same pinned build as the chat one, and the
    # same flags `infra/k8s/apps/llama-embed.yaml` runs - BGE is a BERT encoder
    # trained at 512 tokens and llama.cpp needs `n_ubatch >= n_ctx` for a
    # non-causal model, and `--pooling cls` is written out because a mean-pooled
    # vector is a different vector space that still returns plausible numbers.
    # Same `local-model` profile as `llama`, so one flag turns both on.
    profiles: [local-model]
    image: ghcr.io/ggml-org/llama.cpp:server-b10902
    command: ["-m", "/models/${LLAMA_EMBED_MODEL_FILE:-bge-small-en-v1.5-q8_0.gguf}", "--embedding", "--pooling", "cls", "--ctx-size", "512", "--ubatch-size", "512", "--host", "0.0.0.0", "--port", "8083"]
    ports: ["8083:8083"]
    volumes: ["${MODELS_DIR:-./.cache/models}:/models:ro"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/health"]
      interval: 10s
      timeout: 5s
      # ~130 MB, not the chat model's several gigabytes.
      retries: 24
      start_period: 20s

volumes:
  pgdata:
  qdrantdata:
